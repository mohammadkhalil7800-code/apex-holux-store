<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apex Holux Ultra Store</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800;900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Montserrat,sans-serif}
body{background:#050505;color:#fff;overflow-x:hidden}

/* HEADER */
header{
position:sticky;top:0;z-index:999;
display:flex;justify-content:space-between;align-items:center;
padding:18px 6%;
background:rgba(0,0,0,0.85);
backdrop-filter:blur(10px);
border-bottom:1px solid rgba(255,255,255,0.08);
}
.logo{font-size:28px;font-weight:900}
.logo span{color:#ff9800}
nav a{color:#fff;margin:0 10px;text-decoration:none;font-size:14px}
nav a:hover{color:#ff9800}

/* HERO */
.hero{
height:100vh;
display:flex;align-items:center;justify-content:center;
text-align:center;
background:linear-gradient(rgba(0,0,0,0.7),#000),
url('https://images.unsplash.com/photo-1528701800489-20be3c5c9c8c') center/cover;
}
.hero h1{font-size:70px;font-weight:900}
.hero span{color:#ff9800}
.hero p{opacity:0.8;margin-top:15px}
.btn-main{
margin-top:25px;
padding:15px 40px;
background:#ff9800;
border:none;
border-radius:40px;
font-weight:800;
cursor:pointer;
transition:0.3s;
}
.btn-main:hover{transform:scale(1.05);background:#fff}

/* STATS */
.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
padding:60px 6%;
background:#0c0c0c;
}
.stat{background:#111;padding:25px;border-radius:18px;text-align:center}
.stat h2{color:#ff9800;font-size:35px}

/* PRODUCTS */
.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:25px;
padding:60px 6%;
}

.card{
background:#0f0f0f;
border-radius:20px;
overflow:hidden;
transition:0.3s;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
}
.card:hover{transform:translateY(-10px)}
.card img{width:100%;height:250px;object-fit:cover;display:block}

.info{padding:18px}
.info h3{margin-bottom:5px}

.price{color:#ff9800;font-size:22px;font-weight:800;margin:8px 0}

.btn{
width:100%;
padding:12px;
background:#ff9800;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:800;
transition:0.3s;
}
.btn:hover{background:#fff;transform:scale(1.03)}

/* CART */
.cart{
padding:50px 6%;
background:#0c0c0c;
}
.cart h2{margin-bottom:20px}
.cart-item{
padding:8px 0;
border-bottom:1px solid #222;
display:flex;
justify-content:space-between;
}
.total{color:#ff9800;font-size:28px;margin-top:15px}

/* FOOTER */
footer{
text-align:center;
padding:60px 20px;
background:#000;
border-top:1px solid #111;
}
footer h1 span{color:#ff9800}

/* WHATSAPP */
.whatsapp{
position:fixed;
bottom:20px;
right:20px;
width:60px;height:60px;
background:#25D366;
border-radius:50%;
display:flex;align-items:center;justify-content:center;
font-size:28px;
text-decoration:none;
color:#fff;
}
</style>
</head>

<body>

<header>
<div class="logo">🔥 Apex <span>Holux</span></div>
<nav>
<a href="#">Home</a>
<a href="#shop">Shop</a>
<a href="#cart">Cart</a>
</nav>
</header>

<section class="hero">
<div>
<h1>GLOBAL <span>FASHION</span> STORE</h1>
<p>Premium Sneakers • Slides • Sketchers • Luxury Streetwear</p>
<button class="btn-main">Explore Now</button>
</div>
</section>

<section class="stats">
<div class="stat"><h2>100K+</h2><p>Customers</p></div>
<div class="stat"><h2>50+</h2><p>Brands</p></div>
<div class="stat"><h2>24/7</h2><p>Orders</p></div>
<div class="stat"><h2>100%</h2><p>Premium</p></div>
</section>

<section class="products" id="shop"></section>

<section class="cart" id="cart">
<h2>🛒 Cart</h2>
<div id="cartItems"></div>
<div class="total">Total: $<span id="total">0</span></div>
</section>

<footer>
<h1>🔥 Apex <span>Holux</span></h1>
<p>Ultra Global Fashion Marketplace</p>
</footer>

<a class="whatsapp" href="https://wa.me/93764594322">💬</a>

<script>
let products=[
{name:"Nike Air Force 1",price:90,img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff"},
{name:"Jordan Retro 4",price:180,img:"https://images.unsplash.com/photo-1600180758890-6b94519a8ba6"},
{name:"Adidas Ultraboost",price:120,img:"https://images.unsplash.com/photo-1528701800489-20be3c5c9c8c"},
{name:"Sketchers Comfort",price:95,img:"https://images.unsplash.com/photo-1519741497674-611481863552"}
];

let cart=[];

function render(){
let box=document.getElementById("shop");
box.innerHTML="";

products.forEach((p,i)=>{
box.innerHTML+=`
<div class="card">
<img src="${p.img}">
<div class="info">
<h3>${p.name}</h3>
<div class="price">$${p.price}</div>
<button class="btn" onclick="add(${i})">Add</button>
</div>
</div>`;
});
}
render();

function add(i){
cart.push(products[i]);
updateCart();
}

function updateCart(){
let box=document.getElementById("cartItems");
box.innerHTML="";
let total=0;

cart.forEach(p=>{
total+=Number(p.price);
box.innerHTML+=`
<div class="cart-item">
<span>${p.name}</span>
<span>$${p.price}</span>
</div>`;
});

document.getElementById("total").innerText=total;
}
</script>

</body>
</html>
