<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌍 Apex Holux Global Market</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#0b0f1a;
color:white;
overflow-x:hidden;
}

/* HEADER */

header{
position:sticky;
top:0;
z-index:1000;
background:#0f172a;
padding:15px 5%;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid rgba(255,255,255,.1);
}

.logo{
font-size:28px;
font-weight:700;
color:#00e5ff;
}

nav a{
color:white;
text-decoration:none;
margin:0 15px;
font-size:15px;
transition:.3s;
}

nav a:hover{
color:#00e5ff;
}

/* HERO */

.hero{
height:90vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:20px;
background:
linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.7)),
url('https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=1600');
background-size:cover;
background-position:center;
}

.hero-content h1{
font-size:65px;
margin-bottom:15px;
font-weight:700;
}

.hero-content p{
font-size:20px;
opacity:.9;
margin-bottom:25px;
}

.hero button{
padding:15px 35px;
border:none;
background:#00e5ff;
color:black;
font-size:18px;
font-weight:600;
border-radius:50px;
cursor:pointer;
transition:.3s;
}

.hero button:hover{
transform:scale(1.08);
}

/* SEARCH */

.search-box{
padding:30px 5%;
text-align:center;
}

.search-box input{
width:100%;
max-width:600px;
padding:15px;
border:none;
border-radius:40px;
font-size:16px;
outline:none;
}

/* FILTERS */

.filters{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:10px;
padding:10px;
}

.filters button{
padding:10px 20px;
border:none;
border-radius:30px;
background:#111827;
color:white;
cursor:pointer;
transition:.3s;
}

.filters button:hover{
background:#00e5ff;
color:black;
}

/* PRODUCTS */

.container{
padding:40px 5%;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:25px;
}

.card{
background:#111827;
border-radius:25px;
overflow:hidden;
transition:.4s;
position:relative;
box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.card:hover{
transform:translateY(-10px);
}

.badge{
position:absolute;
top:15px;
left:15px;
background:#00e5ff;
color:black;
padding:6px 12px;
font-size:12px;
font-weight:700;
border-radius:20px;
}

.card img{
width:100%;
height:260px;
object-fit:cover;
}

.info{
padding:20px;
}

.info h3{
font-size:22px;
margin-bottom:10px;
}

.price{
font-size:22px;
font-weight:700;
color:#00e5ff;
margin-bottom:15px;
}

.card button{
width:100%;
padding:13px;
border:none;
border-radius:14px;
background:#00e5ff;
font-size:16px;
font-weight:600;
cursor:pointer;
}

/* CART */

.cart{
margin:40px 5%;
background:#111827;
padding:25px;
border-radius:25px;
}

.cart h2{
margin-bottom:20px;
}

.total{
font-size:25px;
margin-top:20px;
color:#00e5ff;
}

/* FOOTER */

footer{
margin-top:60px;
background:#020617;
padding:50px 5%;
text-align:center;
}

footer h2{
font-size:35px;
margin-bottom:10px;
color:#00e5ff;
}

footer p{
opacity:.8;
margin:8px 0;
}

/* WHATSAPP */

.whatsapp{
position:fixed;
bottom:25px;
right:25px;
width:70px;
height:70px;
border-radius:50%;
background:#25D366;
display:flex;
align-items:center;
justify-content:center;
font-size:35px;
text-decoration:none;
color:white;
box-shadow:0 10px 25px rgba(0,0,0,.5);
z-index:1000;
}

@media(max-width:768px){

.hero-content h1{
font-size:40px;
}

.hero-content p{
font-size:16px;
}

}

</style>
</head>

<body>

<header>

<div class="logo">
🌍 Apex Holux
</div>

<nav>
<a href="#">Home</a>
<a href="#">Global Shop</a>
<a href="#">Trending</a>
<a href="#">Luxury</a>
<a href="#">Contact</a>
</nav>

</header>

<section class="hero">

<div class="hero-content">

<h1>GLOBAL FASHION MARKET</h1>

<p>
Premium Sneakers • Luxury Slides • Fashion Sandals • Worldwide Trend
</p>

<button onclick="window.scrollTo(0,700)">
Shop Now
</button>

</div>

</section>

<div class="search-box">

<input 
type="text" 
placeholder="Search Global Products..."
oninput="searchProducts(this.value)"
>

</div>

<div class="filters">

<button onclick="filter('all')">All</button>
<button onclick="filter('sneaker')">Sneakers</button>
<button onclick="filter('slides')">Slides</button>
<button onclick="filter('sandal')">Sandals</button>
<button onclick="filter('luxury')">Luxury</button>

</div>

<div class="container" id="products"></div>

<div class="cart">

<h2>🛒 Shopping Cart</h2>

<div id="cart"></div>

<div class="total">
Total: $<span id="total">0</span>
</div>

<br>

<button onclick="checkout()">
Order On WhatsApp
</button>

</div>

<footer>

<h2>Apex Holux Global</h2>

<p>Import • Wholesale • Retail</p>

<p>🌍 Worldwide Fashion Market</p>

<p>📞 WhatsApp: 0764 594 322</p>

</footer>

<a 
class="whatsapp"
href="https://wa.me/93764594322"
target="_blank"
>
💬
</a>

<script>

const PHONE = "93764594322";

const products = [

{
name:"Nike Air Force 1",
price:120,
cat:"sneaker",
badge:"BEST SELLER",
img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=1000"
},

{
name:"Jordan Retro High",
price:220,
cat:"sneaker",
badge:"TRENDING",
img:"https://images.unsplash.com/photo-1552346154-21d32810aba3?w=1000"
},

{
name:"Luxury Beige Sandal",
price:75,
cat:"sandal",
badge:"HOT",
img:"https://images.unsplash.com/photo-1603487742131-4160ec999306?w=1000"
},

{
name:"Premium Slides",
price:55,
cat:"slides",
badge:"NEW",
img:"https://images.unsplash.com/photo-1597047084897-51e81819a499?w=1000"
},

{
name:"Adidas Ultraboost",
price:180,
cat:"sneaker",
badge:"SPORT",
img:"https://images.unsplash.com/photo-1528701800489-20be3c5c9c8c?w=1000"
},

{
name:"Luxury Fashion Sneaker",
price:260,
cat:"luxury",
badge:"LUXURY",
img:"https://images.unsplash.com/photo-1549298916-b41d501d3772?w=1000"
},

{
name:"Soft Comfort Slides",
price:45,
cat:"slides",
badge:"TOP",
img:"https://images.unsplash.com/photo-1600180758890-6b94519a8ba6?w=1000"
},

{
name:"Premium Leather Boots",
price:190,
cat:"luxury",
badge:"WINTER",
img:"https://images.unsplash.com/photo-1525966222134-fcfa99b8ae77?w=1000"
}

];

let cart = [];
let total = 0;

function render(list){

let box = document.getElementById("products");

box.innerHTML = "";

list.forEach(p=>{

box.innerHTML += `

<div class="card">

<div class="badge">
🔥 ${p.badge}
</div>

<img 
src="${p.img}" 
loading="lazy"
onerror="this.src='https://via.placeholder.com/400?text=Apex+Holux'"
>

<div class="info">

<h3>${p.name}</h3>

<div class="price">
$${p.price}
</div>

<button onclick="add('${p.name}',${p.price})">
Add To Cart
</button>

</div>

</div>

`;

});

}

render(products);

function add(name,price){

cart.push({name,price});

total += price;

document.getElementById("cart").innerHTML += `
<p>✅ ${name} - $${price}</p>
`;

document.getElementById("total").innerText = total;

}

function searchProducts(val){

render(
products.filter(p=>
p.name.toLowerCase().includes(val.toLowerCase())
)
);

}

function filter(cat){

if(cat==="all"){
render(products);
return;
}

render(products.filter(p=>p.cat===cat));

}

function checkout(){

if(cart.length===0){

alert("Cart is Empty");

return;

}

let msg = "🌍 GLOBAL ORDER %0A%0A";

cart.forEach(i=>{
msg += "✅ " + i.name + " - $" + i.price + "%0A";
});

msg += "%0A Total: $" + total;

window.open(
"https://wa.me/"+PHONE+"?text="+msg
);

}

</script>

</body>
</html>
