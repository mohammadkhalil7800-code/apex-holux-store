<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apex Holux Global Store</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0a0a;
color:white;
}

header{
display:flex;
justify-content:space-between;
padding:15px;
background:#000;
}

.logo{
font-size:22px;
font-weight:bold;
}

.logo span{color:#ff9900;}

.login{
padding:5px 10px;
background:#ff9900;
border:none;
cursor:pointer;
font-weight:bold;
}

/* LOGIN */

#loginBox{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
}

input{
padding:10px;
margin:5px;
width:200px;
border:none;
border-radius:8px;
}

button{
padding:10px;
background:#ff9900;
border:none;
font-weight:bold;
cursor:pointer;
border-radius:8px;
}

/* ADMIN */

.admin{
padding:15px;
background:#111;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:10px;
padding:15px;
}

.card{
background:#111;
padding:10px;
border-radius:10px;
}

.card img{
width:100%;
height:140px;
object-fit:cover;
border-radius:10px;
}

.price{
color:#ff9900;
font-weight:bold;
}

/* CART */

.cart{
position:fixed;
right:10px;
bottom:10px;
background:#111;
padding:10px;
border-radius:10px;
width:220px;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
<h2>Admin Login</h2>
<input id="u" placeholder="Username">
<input id="p" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<header>
<div class="logo">Apex <span>Holux</span></div>
<div>Global Store</div>
</header>

<!-- ADMIN PANEL -->
<div class="admin">
<h3>Add Product</h3>
<input id="name" placeholder="Name">
<input id="price" placeholder="Price">
<input id="img" placeholder="Image URL">
<button onclick="addProduct()">Add</button>
</div>

<!-- PRODUCTS -->
<div class="products" id="box"></div>

<!-- CART -->
<div class="cart">
<h4>Cart</h4>
<div id="cart"></div>
<p>Total: $<span id="total">0</span></p>
<button onclick="checkout()">WhatsApp</button>
</div>

<script>

let products=[
{name:"Nike Air Force",price:120,img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=700"},
{name:"Adidas Slides",price:60,img:"https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?w=700"}
];

let cart=[];
let total=0;

/* LOGIN */
function login(){
let u=document.getElementById("u").value;
let p=document.getElementById("p").value;

if(u==="admin" && p==="1234"){
document.getElementById("loginBox").style.display="none";
}else{
alert("Wrong Login");
}
}

/* SHOW */
function show(){
let box=document.getElementById("box");
box.innerHTML="";

products.forEach((p,i)=>{
box.innerHTML+=`
<div class="card">
<img src="${p.img}">
<h3>${p.name}</h3>
<div class="price">$${p.price}</div>
<button onclick="add(${i})">Add</button>
<button onclick="del(${i})" style="background:red;color:white;">Delete</button>
</div>`;
});
}

/* ADD PRODUCT */
function addProduct(){
let n=document.getElementById("name").value;
let p=document.getElementById("price").value;
let img=document.getElementById("img").value;

products.push({name:n,price:Number(p),img:img});
show();
}

/* DELETE */
function del(i){
products.splice(i,1);
show();
}

/* CART */
function add(i){
cart.push(products[i]);
update();
}

function update(){
let c=document.getElementById("cart");
c.innerHTML="";
total=0;

cart.forEach(i=>{
total+=i.price;
c.innerHTML+=i.name+"<br>";
});

document.getElementById("total").innerText=total;
}

/* CHECKOUT */
function checkout(){
let msg="ORDER:\n";
cart.forEach(i=>{
msg+=i.name+" - $"+i.price+"\n";
});

window.open("https://wa.me/93764594322?text="+encodeURIComponent(msg));
}

show();

</script>

</body>
</html>
