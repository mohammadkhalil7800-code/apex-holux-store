<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>🌍 Apex Holux Elite Store</title>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white}

header{
background:#020617;
padding:15px;
text-align:center;
}

input{
width:80%;
padding:10px;
margin-top:10px;
border-radius:8px;
border:none;
}

.container{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
gap:15px;
padding:15px;
}

.card{
background:#1e293b;
padding:10px;
border-radius:10px;
text-align:center;
transition:.3s;
}

.card:hover{transform:scale(1.05)}

.card img{
width:100%;
height:150px;
object-fit:cover;
border-radius:8px;
}

button{
background:#f59e0b;
border:none;
padding:6px;
margin:3px;
cursor:pointer;
}

.cart{
background:#020617;
padding:15px;
margin:15px;
border-radius:10px;
}

</style>
</head>

<body>

<header>
<h2>🔥 Apex Holux Elite</h2>
<input placeholder="Search..." oninput="search(this.value)">
</header>

<div class="container" id="products"></div>

<div class="cart">
<h3>🛒 Cart</h3>
<div id="cart"></div>
<h4>Total: $<span id="total">0</span></h4>
<button onclick="checkout()">Order WhatsApp</button>
</div>

<script>

const PHONE="93764594322";

const products=[
{name:"Nike Air Force",price:90,img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"},
{name:"Adidas Boost",price:120,img:"https://images.unsplash.com/photo-1528701800489-20be3c5c9c8c?w=500"},
{name:"Slides Premium",price:40,img:"https://images.unsplash.com/photo-1597047084897-51e81819a499?w=500"},
{name:"Boots Leather",price:110,img:"https://images.unsplash.com/photo-1600185365483?w=500"}
];

let cart=JSON.parse(localStorage.getItem("cart"))||[];

function save(){
localStorage.setItem("cart",JSON.stringify(cart));
}

function render(list=products){
let box=document.getElementById("products");
box.innerHTML="";

list.forEach((p,i)=>{
box.innerHTML+=`
<div class="card">
<img src="${p.img}" onerror="this.src='https://via.placeholder.com/200'">
<h3>${p.name}</h3>
<p>$${p.price}</p>

<button onclick="add(${i})">Add</button>
<button onclick="view(${i})">View</button>

</div>`;
});
}

render();

function add(i){
cart.push(products[i]);
save();
showCart();
}

function remove(i){
cart.splice(i,1);
save();
showCart();
}

function showCart(){
let c=document.getElementById("cart");
let total=0;
c.innerHTML="";

cart.forEach((item,i)=>{
total+=item.price;
c.innerHTML+=`
<p>${item.name} 
<button onclick="remove(${i})">❌</button>
</p>`;
});

document.getElementById("total").innerText=total;
}

showCart();

function search(val){
render(products.filter(p=>p.name.toLowerCase().includes(val.toLowerCase())));
}

function view(i){
alert(products[i].name + "\nPrice: $" + products[i].price);
}

function checkout(){
if(cart.length==0){alert("Cart empty");return;}

let msg="🛒 ORDER\n";
cart.forEach(i=> msg+=i.name+"\n");

window.open("https://wa.me/"+PHONE+"?text="+encodeURIComponent(msg));
}

</script>

</body>
</html>
