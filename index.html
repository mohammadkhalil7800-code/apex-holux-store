<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 Apex Holux ULTRA GLOBAL</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
scroll-behavior:smooth;
}

body{
background:#050505;
color:white;
overflow-x:hidden;
}

/* NAVBAR */

header{
position:fixed;
top:0;
left:0;
width:100%;
padding:18px 7%;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(0,0,0,0.75);
backdrop-filter:blur(12px);
z-index:1000;
border-bottom:1px solid rgba(255,255,255,0.1);
}

.logo{
font-size:34px;
font-weight:900;
color:#fff;
}

.logo span{
color:#ff9900;
}

nav a{
color:white;
text-decoration:none;
margin-left:20px;
font-size:15px;
transition:0.3s;
}

nav a:hover{
color:#ff9900;
}

/* HERO */

.hero{
height:100vh;
background:
linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.7)),
url('https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=1600')
center/cover;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
}

.hero-content h1{
font-size:75px;
font-weight:900;
line-height:1.1;
margin-bottom:20px;
}

.hero-content span{
color:#ff9900;
}

.hero-content p{
font-size:20px;
max-width:800px;
margin:auto;
opacity:0.9;
}

.hero-btn{
display:inline-block;
margin-top:30px;
padding:16px 40px;
background:#ff9900;
color:black;
font-weight:bold;
border-radius:50px;
text-decoration:none;
font-size:18px;
transition:0.3s;
}

.hero-btn:hover{
transform:scale(1.08);
}

/* SEARCH */

.search-box{
padding:40px 7%;
text-align:center;
background:#0d0d0d;
}

.search{
width:100%;
max-width:700px;
padding:16px;
border:none;
border-radius:50px;
font-size:18px;
outline:none;
}

/* CATEGORY */

.categories{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:15px;
padding:20px;
background:#0d0d0d;
}

.categories button{
padding:12px 24px;
border:none;
background:#1b1b1b;
color:white;
border-radius:50px;
cursor:pointer;
transition:0.3s;
font-weight:600;
}

.categories button:hover{
background:#ff9900;
color:black;
}

/* PRODUCTS */

.products{
padding:70px 7%;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:30px;
}

.card{
background:#111;
border-radius:25px;
overflow:hidden;
transition:0.4s;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
position:relative;
}

.card:hover{
transform:translateY(-12px);
}

.card img{
width:100%;
height:280px;
object-fit:cover;
}

.tag{
position:absolute;
top:15px;
left:15px;
background:#ff0000;
padding:8px 14px;
border-radius:30px;
font-size:13px;
font-weight:bold;
}

.info{
padding:22px;
}

.info h2{
font-size:24px;
margin-bottom:10px;
}

.price{
font-size:28px;
color:#ff9900;
font-weight:800;
margin-bottom:15px;
}

.desc{
font-size:14px;
line-height:1.6;
opacity:0.8;
margin-bottom:20px;
}

.btn{
width:100%;
padding:15px;
border:none;
background:#ff9900;
font-size:17px;
font-weight:bold;
border-radius:12px;
cursor:pointer;
transition:0.3s;
}

.btn:hover{
background:white;
}

/* CART */

.cart{
margin:50px 7%;
background:#111;
padding:30px;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

.cart h2{
margin-bottom:20px;
font-size:35px;
}

#cartItems p{
margin:10px 0;
font-size:16px;
}

.total{
margin-top:20px;
font-size:30px;
font-weight:900;
color:#ff9900;
}

.checkout{
margin-top:25px;
width:100%;
padding:18px;
border:none;
background:#25D366;
font-size:20px;
font-weight:bold;
border-radius:15px;
cursor:pointer;
}

/* FOOTER */

footer{
background:#0a0a0a;
padding:60px 20px;
text-align:center;
margin-top:60px;
}

footer h1{
font-size:45px;
margin-bottom:15px;
}

footer span{
color:#ff9900;
}

footer p{
opacity:0.8;
margin-top:10px;
}

.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
width:70px;
height:70px;
display:flex;
justify-content:center;
align-items:center;
border-radius:50%;
font-size:35px;
text-decoration:none;
color:white;
box-shadow:0 10px 20px rgba(0,0,0,0.5);
}

/* MOBILE */

@media(max-width:768px){

.hero-content h1{
font-size:45px;
}

nav{
display:none;
}

}

</style>
</head>

<body>

<header>

<div class="logo">
🔥 Apex <span>Holux</span>
</div>

<nav>
<a href="#">Home</a>
<a href="#">Global</a>
<a href="#">Trending</a>
<a href="#">Luxury</a>
<a href="#">Contact</a>
</nav>

</header>

<section class="hero">

<div class="hero-content">

<h1>
WORLD CLASS <br>
<span>FASHION MARKET</span>
</h1>

<p>
Luxury Sneakers • Premium Slides • QD Sandals • Fashion Shoes • Global Brands
</p>

<a href="#shop" class="hero-btn">
Shop Now
</a>

</div>

</section>

<div class="search-box">

<input class="search"
placeholder="Search Global Fashion Products..."
oninput="searchProducts(this.value)">

</div>

<div class="categories">

<button onclick="filterProducts('all')">All</button>
<button onclick="filterProducts('sneaker')">Sneakers</button>
<button onclick="filterProducts('slides')">Slides</button>
<button onclick="filterProducts('sandal')">QD Sandals</button>
<button onclick="filterProducts('sport')">Sport</button>

</div>

<section class="products" id="shop"></section>

<section class="cart">

<h2>🛒 Shopping Cart</h2>

<div id="cartItems"></div>

<div class="total">
Total: $<span id="total">0</span>
</div>

<button class="checkout" onclick="checkout()">
Order on WhatsApp
</button>

</section>

<footer>

<h1>🔥 Apex <span>Holux</span></h1>

<p>GLOBAL LUXURY MARKET</p>

<p>📞 WhatsApp: 0764 594 322</p>

<p>🌍 Worldwide Premium Fashion Store</p>

</footer>

<a class="whatsapp"
href="https://wa.me/93764594322">
💬
</a>

<script>

const PHONE = "93764594322";

const products = [

{
name:"Nike Air Force 1",
price:90,
cat:"sneaker",
img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=700"
},

{
name:"Jordan Retro 4",
price:180,
cat:"sneaker",
img:"https://images.unsplash.com/photo-1600180758890-6b94519a8ba6?w=700"
},

{
name:"Adidas Ultraboost",
price:120,
cat:"sport",
img:"https://images.unsplash.com/photo-1528701800489-20be3c5c9c8c?w=700"
},

{
name:"Skechers Premium",
price:95,
cat:"sport",
img:"https://images.unsplash.com/photo-1519741497674-611481863552?w=700"
},

{
name:"Luxury QD 555",
price:55,
cat:"sandal",
img:"https://images.unsplash.com/photo-1603487742131-4160ec999306?w=700"
},

{
name:"QD Fashion Sandal",
price:60,
cat:"sandal",
img:"https://images.unsplash.com/photo-1608256246200-53e8b47b2f80?w=700"
},

{
name:"Nike Slides",
price:45,
cat:"slides",
img:"https://images.unsplash.com/photo-1597047084897-51e81819a499?w=700"
},

{
name:"Adidas Slides",
price:40,
cat:"slides",
img:"https://images.unsplash.com/photo-1606813902913-3f3a0a0c9a9b?w=700"
},

{
name:"Premium Soft Slides",
price:38,
cat:"slides",
img:"https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?w=700"
},

{
name:"Puma RS-X",
price:100,
cat:"sneaker",
img:"https://images.unsplash.com/photo-1606813907291-d86efa9b94db?w=700"
},

{
name:"Luxury White Sneaker",
price:110,
cat:"sneaker",
img:"https://images.unsplash.com/photo-1552346154-21d32810aba3?w=700"
},

{
name:"Street Fashion Sneaker",
price:105,
cat:"sneaker",
img:"https://images.unsplash.com/photo-1579338559194-a162d19bf842?w=700"
}

];

let cart = [];
let total = 0;

function renderProducts(list){

const box = document.getElementById("shop");

box.innerHTML = "";

list.forEach(p=>{

box.innerHTML += `

<div class="card">

<div class="tag">
🔥 Best Seller
</div>

<img src="${p.img}"
loading="lazy"
onerror="this.src='https://via.placeholder.com/400?text=Fashion'">

<div class="info">

<h2>${p.name}</h2>

<div class="price">
$${p.price}
</div>

<div class="desc">
Premium global fashion product with luxury quality and trending design.
</div>

<button class="btn"
onclick="addToCart('${p.name}',${p.price})">
Add To Cart
</button>

</div>

</div>

`;

});

}

renderProducts(products);

function addToCart(name,price){

cart.push({name,price});

total += price;

document.getElementById("cartItems").innerHTML += `
<p>✔ ${name} - $${price}</p>
`;

document.getElementById("total").innerText = total;

}

function filterProducts(cat){

if(cat==="all"){
renderProducts(products);
return;
}

renderProducts(products.filter(p=>p.cat===cat));

}

function searchProducts(val){

renderProducts(
products.filter(p=>
p.name.toLowerCase().includes(val.toLowerCase())
)
);

}

function checkout(){

if(cart.length===0){

alert("Cart is empty!");
return;

}

let msg = "🔥 APEX HOLUX GLOBAL ORDER 🔥\n\n";

cart.forEach(i=>{

msg += "✔ " + i.name + " - $" + i.price + "\n";

});

msg += "\n💰 Total: $" + total;

window.open(
"https://wa.me/" + PHONE +
"?text=" + encodeURIComponent(msg)
);

}

</script>

</body>
</html>
