<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>🌍 AMAZON PRO STORE</title>

<style>
body{margin:0;font-family:Arial;background:#f3f3f3}

header{
background:#111;
color:white;
padding:15px;
text-align:center;
font-size:20px;
}

.topbar{
display:flex;
gap:10px;
padding:10px;
flex-wrap:wrap;
}

input,select{
padding:10px;
flex:1;
min-width:120px;
}

.layout{
display:flex;
gap:10px;
padding:10px;
}

.products{
flex:3;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:10px;
}

.card{
background:white;
padding:10px;
border-radius:10px;
box-shadow:0 2px 6px rgba(0,0,0,0.2);
text-align:center;
}

.card img{
width:100%;
height:140px;
object-fit:cover;
border-radius:10px;
}

.sidebar{
flex:1;
background:white;
padding:10px;
border-radius:10px;
height:fit-content;
}

button{
width:100%;
padding:8px;
margin-top:5px;
background:#ff9900;
border:none;
font-weight:bold;
cursor:pointer;
}

.small{font-size:12px;color:gray}
</style>
</head>

<body>

<header>🌍 AMAZON PRO STORE (UPGRADED)</header>

<!-- SEARCH + FILTER -->
<div class="topbar">
<input id="search" placeholder="Search products..." oninput="render()">

<select id="filter" onchange="render()">
<option>All</option>
<option>Sneakers</option>
<option>Running</option>
<option>Slides</option>
<option>Comfort</option>
</select>
</div>

<div class="layout">

<!-- PRODUCTS -->
<div class="products" id="products"></div>

<!-- SIDEBAR -->
<div class="sidebar">

<h3>🛒 Cart</h3>
<div id="cart"></div>
<h4>Total: $<span id="total">0</span></h4>

<button onclick="checkout()">WhatsApp Checkout</button>

<hr>

<p class="small">🔥 AI Mini Dashboard</p>
<div id="dash"></div>

</div>

</div>

<script>

/* ================= PRODUCTS ================= */
let products = [
{name:"Nike Air Force 1",price:90,cat:"Sneakers",img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=400"},
{name:"Adidas Ultraboost",price:120,cat:"Running",img:"https://images.unsplash.com/photo-1528701800489?auto=format&fit=crop&w=400"},
{name:"Nike Slides",price:45,cat:"Slides",img:"https://images.unsplash.com/photo-1597047084897?auto=format&fit=crop&w=400"},
{name:"Sketchers Comfort",price:70,cat:"Comfort",img:"https://images.unsplash.com/photo-1528701800489?auto=format&fit=crop&w=400"}
];

let cart = JSON.parse(localStorage.getItem("cart")) || [];

/* ================= RENDER ================= */
function render(){

let box = document.getElementById("products");
let search = document.getElementById("search").value.toLowerCase();
let filter = document.getElementById("filter").value;

box.innerHTML="";

products
.filter(p=>{
return (
p.name.toLowerCase().includes(search) &&
(filter==="All" || p.cat===filter)
);
})
.forEach((p,i)=>{
box.innerHTML += `
<div class="card">
<img src="${p.img}" onerror="this.src='https://via.placeholder.com/300'">
<h4>${p.name}</h4>
<p>$${p.price}</p>
<p class="small">${p.cat}</p>
<button onclick="add(${i})">Add to Cart</button>
</div>
`;
});
}

/* ================= CART ================= */
function add(i){
cart.push(products[i]);
localStorage.setItem("cart",JSON.stringify(cart));
renderCart();
}

/* ================= CART UI ================= */
function renderCart(){
let c=document.getElementById("cart");
c.innerHTML="";
let total=0;

cart.forEach((p,i)=>{
total+=p.price;
c.innerHTML+=`
<p>${p.name} - $${p.price}</p>
`;
});

document.getElementById("total").innerText=total;
updateDash();
}

/* ================= CHECKOUT ================= */
function checkout(){
if(cart.length===0) return alert("Cart empty");

let msg="🛒 ORDER:\n\n";
let total=0;

cart.forEach(p=>{
msg+=p.name+" - $"+p.price+"\n";
total+=p.price;
});

msg+="\nTOTAL: $"+total;

window.open("https://wa.me/93764594322?text="+encodeURIComponent(msg));
}

/* ================= DASHBOARD ================= */
function updateDash(){
document.getElementById("dash").innerHTML=`
<p>📦 Products: ${products.length}</p>
<p>🛒 Cart Items: ${cart.length}</p>
<p>💰 Value: $${cart.reduce((a,b)=>a+b.price,0)}</p>
`;
}

/* INIT */
render();
renderCart();

</script>

</body>
</html>
