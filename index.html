<!-- ULTRA PREMIUM PRODUCT CARD -->

<div class="card">

<div class="badge">
🔥 TOP SELLER
</div>

<div class="wishlist">
❤
</div>

<img 
src="${p.img}" 
alt="${p.name}"
loading="lazy"
onerror="this.src='https://via.placeholder.com/600x600?text=Apex+Holux'"
>

<div class="info">

<div class="brand">
APEX HOLUX PREMIUM
</div>

<h2>
${p.name}
</h2>

<div class="rating">

<span class="stars">
⭐⭐⭐⭐⭐
</span>

<span class="reviews">
(4.9 • 12K Reviews)
</span>

</div>

<div class="price-row">

<div class="price">
$${p.price}
</div>

<div class="old-price">
$${p.price + 40}
</div>

</div>

<div class="shipping">
🚚 Free Worldwide Shipping
</div>

<div class="desc">
Luxury premium trending product with world-class quality, modern fashion design and global bestseller styling.
</div>

<div class="stock">
🟢 In Stock
</div>

<div class="card-buttons">

<button class="btn cart-btn"
onclick="addToCart(${index})">
🛒 Add To Cart
</button>

<button class="btn buy-btn"
onclick="buyNow(${index})">
⚡ Buy Now
</button>

</div>

</div>

</div>
