<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apex Holux Global Export</title>

<style>

body{
margin:0;
font-family:Arial;
background:#050505;
color:white;
}

/* HERO */
.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
background:linear-gradient(rgba(0,0,0,0.7),black),
url('https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=1600');
background-size:cover;
}

.hero h1{
font-size:60px;
color:white;
}

.hero span{
color:#ff9900;
}

/* PRODUCTS */
.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:50px;
}

.card{
background:#111;
border-radius:20px;
overflow:hidden;
padding:15px;
}

.card img{
width:100%;
border-radius:15px;
}

.price{
color:#ff9900;
font-size:25px;
font-weight:bold;
}

button{
width:100%;
padding:12px;
background:#ff9900;
border:none;
font-weight:bold;
cursor:pointer;
border-radius:10px;
}

button:hover{
background:white;
}

</style>
</head>

<body>

<div class="hero">
<h1>Apex <span>Holux</span></h1>
<p>Global Luxury Shoes Export Company</p>
</div>

<div class="products">

<div class="card">
<img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=700">
<h3>Nike Air Force</h3>
<div class="price">$120</div>
<button>Inquiry</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1600180758890-6b94519a8ba6?w=700">
<h3>Jordan Retro</h3>
<div class="price">$210</div>
<button>Inquiry</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1528701800489-20be3c5c9c8c?w=700">
<h3>Adidas Boost</h3>
<div class="price">$150</div>
<button>Inquiry</button>
</div>

</div>

</body>
</html>
