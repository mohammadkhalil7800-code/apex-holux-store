<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 Apex Holux Ultra Enterprise</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800;900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Montserrat,sans-serif}
body{background:#050505;color:#fff}

/* HEADER */
header{
position:sticky;top:0;
display:flex;justify-content:space-between;align-items:center;
padding:18px 6%;
background:rgba(0,0,0,0.85);
backdrop-filter:blur(12px);
border-bottom:1px solid #222;
z-index:999;
}
.logo{font-size:28px;font-weight:900}
.logo span{color:#ff9900}

/* HERO */
.hero{
height:90vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
background:
linear-gradient(rgba(0,0,0,0.7),#000),
url('https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=1600') center/cover;
}
.hero h1{font-size:70px;font-weight:900}
.hero span{color:#ff9900}

/* PRODUCTS */
.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:25px;
padding:60px 6%;
}

.card{
background:#111;
border-radius:20px;
overflow:hidden;
transition:0.3s;
box-shadow:0 10px 30px rgba(0,0,0,0.5);
}
.card:hover{transform:translateY(-10px)}
.card img{width:100%;height:250px;object-fit:cover}

.info{padding:18px}
.price{color:#ff9900;font-size:22px;font-weight:800}

.btn{
width:100%;
padding:12px;
border:none;
background:#ff9900;
font-weight:900;
cursor:pointer;
border-radius:10px;
}

/* CART */
.cart{
padding:40px 6%;
background:#0d0d0d;
}
.total{color:#ff9900;font-size:28px;margin-top:10px}

/* ADMIN */
.admin{
padding:40px 6%;
background:#0b0b0b;
}
.admin input{
width:100%;
padding:12px;
margin:6px 0;
border:none;
border-radius:8px;
background:#1a1a1a;
color:white;
}
.admin button{
width:100%;
padding:14px;
background:#ff9900;
border:none;
font-weight:900;
border-radius:10px;
cursor:pointer;
}

/* FOOTER */
footer{
text-align:center;
padding:50px;
background:#000;
border-top:1px solid #222;
}
</style>
</head>

<body>

<header>
<div class="logo">🔥 Apex <span>Holux</span></div>
<div>Ultra Enterprise Store</div>
</header>

<section class="hero">
<div>
<h1>WORLD CLASS <br><span>SHOES & SLIDES</span></h1>
<p>Premium Sneakers • Slides • Sandals • Global Fashion</p>
</div>
</section>

<!-- PRODUCTS -->
<section class="products" id="shop"></section>

<!-- CART -->
<section class="cart">
<h2>🛒 Cart</h2>
<div id="cart"></div>
<div class="total">Total: $<span id="total">0</span></div>
<button onclick="checkout()" class="btn">Checkout WhatsApp</button>
</section>

<!-- ADMIN PANEL -->
<section class="admin">
<h2>🧑‍💼 Admin Panel</h2>

<input id="name" placeholder="Product Name">
<input id="price" placeholder="Price">
<input id="img" placeholder="Image URL">
<input id="cat" placeholder="Category (shoes/slides)">
<button onclick="addProduct()">Add Product</button>
</section>

<footer>
🔥 Apex Holux Ultra Enterprise System
</footer>

<script>

let products = JSON.parse(localStorage.getItem("products")) || [

{
name:"Nike Air Force 1",
price:90,
img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=800",
cat:"shoes"
},
{
name:"Adidas Slides Ultra",
price:45,
img:"https://images.unsplash.com/photo-1603487742131-4160ec999306?w=800",
cat:"slides"
},
{
name:"Jordan Retro 4",
price:180,
img:"https://images.unsplash.com/photo-1600180758890-6b94519a8ba6?w=800",
cat:"shoes"
},
{
name:"Luxury Comfort Slides",
price:55,
img:"https://images.unsplash.com/photo-1606813907291-d86efa9b94db?w=800",
cat:"slides"
}

];

let cart = JSON.parse(localStorage.getItem("cart")) || [];
let total = 0;

/* SHOW PRODUCTS */
function render(){
let box=document.getElementById("shop");
box.innerHTML="";

products.forEach((p,i)=>{
box.innerHTML+=`
<div class="card">
<img src="${p.img}">
<div class="info">
<h3>${p.name}</h3>
<div class="price">$${p.price}</div>
<button class="btn" onclick="add(${i})">Add To Cart</button>
</div>
</div>`;
});
}
render();

/* ADD CART */
function add(i){
cart.push(products[i]);
localStorage.setItem("cart",JSON.stringify(cart));
renderCart();
}

/* CART */
function renderCart(){
let box=document.getElementById("cart");
box.innerHTML="";
total=0;

cart.forEach(p=>{
total+=p.price;
box.innerHTML+=`<p>${p.name} - $${p.price}</p>`;
});

document.getElementById("total").innerText=total;
}

/* CHECKOUT */
function checkout(){
let msg="Apex Holux Order:\n\n";
cart.forEach(p=>{
msg+=p.name+" - $"+p.price+"\n";
});
msg+="\nTotal: $"+total;

window.open("https://wa.me/93764594322?text="+encodeURIComponent(msg));
}

/* ADMIN ADD PRODUCT */
function addProduct(){

let n=document.getElementById("name").value;
let p=document.getElementById("price").value;
let i=document.getElementById("img").value;
let c=document.getElementById("cat").value;

products.push({
name:n,
price:Number(p),
img:i,
cat:c
});

localStorage.setItem("products",JSON.stringify(products));

render();

alert("Product Added!");

}

</script>

</body>
</html>
