<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>🌍 AMAZON GOD MODE STORE</title>

<style>
body{margin:0;font-family:Arial;background:#f3f3f3}
header{background:#0f0f0f;color:white;padding:15px;text-align:center}

.layout{
display:flex;
gap:10px;
padding:10px;
}

.products{
flex:3;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
gap:15px;
}

.card{
background:white;
padding:10px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.2);
text-align:center;
}

.card img{
width:100%;
height:140px;
object-fit:cover;
border-radius:10px;
}

.sidebar{
flex:1;
background:white;
padding:10px;
border-radius:10px;
height:fit-content;
}

button{
width:100%;
padding:8px;
margin-top:5px;
background:#ff9900;
border:none;
cursor:pointer;
font-weight:bold;
}

input{
width:90%;
padding:8px;
margin:5px;
}

.small{
font-size:12px;color:gray;
}
</style>

</head>

<body>

<header>🌍 AMAZON GOD MODE (AI + GLOBAL STORE)</header>

<div class="layout">

<!-- PRODUCTS -->
<div class="products" id="products"></div>

<!-- SIDEBAR -->
<div class="sidebar">

<h3>🛒 Cart</h3>
<div id="cart"></div>
<h4>Total: $<span id="total">0</span></h4>

<button onclick="checkout()">WhatsApp Checkout</button>

<hr>

<h3>📦 AI Dashboard</h3>
<p class="small">Auto insights</p>
<div id="dash"></div>

<hr>

<h3>🏬 Admin</h3>
<input id="pname" placeholder="Product">
<input id="pprice" placeholder="Price">
<input id="pimg" placeholder="Image URL">
<button onclick="addProduct()">Add Product</button>

</div>

</div>

<script>

/* ================== AI GLOBAL PRODUCTS ================== */
let products = [
{name:"Nike Air Force 1",price:90,img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff"},
{name:"Adidas Ultraboost",price:120,img:"https://images.unsplash.com/photo-1528701800489-20be3c5c9c8c"},
{name:"Nike Air Max 270",price:130,img:"https://images.unsplash.com/photo-1519744346364"},
{name:"Puma RS-X",price:95,img:"https://images.unsplash.com/photo-1606813907291"},
{name:"Jordan Retro 4",price:180,img:"https://images.unsplash.com/photo-1600180758890"},
{name:"Classic Oxford Shoes",price:110,img:"https://images.unsplash.com/photo-1521334884684"},
{name:"Vans Old Skool",price:70,img:"https://images.unsplash.com/photo-1549298916"},
{name:"New Balance 574",price:95,img:"https://images.unsplash.com/photo-1519741497674"},
{name:"Nike Slides",price:45,img:"https://images.unsplash.com/photo-1597047084897"},
{name:"Adidas Slides",price:40,img:"https://images.unsplash.com/photo-1606813902913"}
];

let cart=[];

/* ================== RENDER PRODUCTS ================== */
function render(){
let box=document.getElementById("products");
box.innerHTML="";

products.forEach((p,i)=>{
box.innerHTML+=`
<div class="card">
<img src="${p.img}">
<h3>${p.name}</h3>
<p>$${p.price}</p>
<button onclick="add(${i})">Add to Cart</button>
</div>`;
});
}
render();

/* ================== CART ================== */
window.add=function(i){
cart.push(products[i]);
renderCart();
updateDash();
}

function renderCart(){
let c=document.getElementById("cart");
let total=0;
c.innerHTML="";

cart.forEach(p=>{
total+=p.price;
c.innerHTML+=`<p>${p.name} - $${p.price}</p>`;
});

document.getElementById("total").innerText=total;
}

/* ================== CHECKOUT ================== */
window.checkout=function(){

if(cart.length===0){
alert("Cart empty");
return;
}

let msg="🛒 AMAZON GOD MODE ORDER\n\n";
let total=0;

cart.forEach(p=>{
msg+=p.name+" - $"+p.price+"\n";
total+=p.price;
});

msg+="\nTOTAL: $"+total;

/* WhatsApp */
window.open(
"https://wa.me/93764594322?text="+encodeURIComponent(msg)
);

}

/* ================== ADMIN ADD ================== */
window.addProduct=function(){

let name=pname.value;
let price=Number(pprice.value);
let img=pimg.value;

if(!name||!price) return alert("Fill all");

products.push({name,price,img});
render();
updateDash();
}

/* ================== AI DASHBOARD ================== */
function updateDash(){

let totalProducts=products.length;
let totalCart=cart.length;
let revenue=cart.reduce((a,b)=>a+b.price,0);

document.getElementById("dash").innerHTML=`
<p>📦 Products: ${totalProducts}</p>
<p>🛒 Cart Items: ${totalCart}</p>
<p>💰 Cart Value: $${revenue}</p>
<p>🔥 Best Seller: ${products[0].name}</p>
`;
}

updateDash();

</script>

</body>
</html>
