<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌍 Apex Holux Global Pro Store</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800;900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Montserrat}
body{background:#050505;color:#fff;overflow-x:hidden}

/* HEADER */
header{
position:fixed;top:0;width:100%;
display:flex;justify-content:space-between;align-items:center;
padding:15px 6%;
background:rgba(0,0,0,0.75);
backdrop-filter:blur(12px);
border-bottom:1px solid #222;
z-index:999;
}
.logo{font-size:26px;font-weight:900}
.logo span{color:#ff9800}
nav a{color:#fff;margin:0 10px;text-decoration:none;font-size:14px}
nav a:hover{color:#ff9800}

/* HERO */
.hero{
height:90vh;
display:flex;align-items:center;justify-content:center;
text-align:center;
background:linear-gradient(rgba(0,0,0,0.7),#000),
url('https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=1600') center/cover;
}
.hero h1{font-size:60px;font-weight:900}
.hero span{color:#ff9800}
.hero p{opacity:0.8;margin-top:10px}

/* SEARCH */
.search{
width:90%;
max-width:700px;
margin:20px auto;
display:block;
padding:15px;
border-radius:40px;
border:none;
outline:none;
}

/* PRODUCTS */
.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:50px 6%;
}

.card{
background:#111;
border-radius:18px;
overflow:hidden;
transition:0.3s;
box-shadow:0 10px 25px rgba(0,0,0,0.4);
}
.card:hover{transform:translateY(-8px)}
.card img{width:100%;height:220px;object-fit:cover}

.info{padding:15px}
.price{color:#ff9800;font-size:20px;font-weight:800;margin:5px 0}
.btn{
width:100%;
padding:12px;
border:none;
background:#ff9800;
font-weight:800;
cursor:pointer;
border-radius:10px;
}

/* CART */
.cart{
padding:40px 6%;
background:#0c0c0c;
}
.total{font-size:28px;color:#ff9800;margin-top:10px}

/* LOGIN */
.loginBox{
position:fixed;
top:50%;left:50%;
transform:translate(-50%,-50%);
background:#111;
padding:25px;
border-radius:15px;
display:none;
width:300px;
}
.loginBox input{
width:100%;
padding:10px;
margin:8px 0;
border:none;
border-radius:8px;
}
.loginBox button{
width:100%;
padding:10px;
background:#ff9800;
border:none;
font-weight:800;
cursor:pointer;
}

/* PAYMENT */
.pay{
margin-top:20px;
padding:15px;
background:#111;
border-radius:12px;
}
.pay button{
margin-top:10px;
width:100%;
padding:10px;
border:none;
background:#25D366;
font-weight:800;
cursor:pointer;
}

/* WHATSAPP */
.whatsapp{
position:fixed;
bottom:20px;
right:20px;
width:60px;height:60px;
background:#25D366;
border-radius:50%;
display:flex;align-items:center;justify-content:center;
font-size:28px;
}
</style>
</head>

<body>

<header>
<div class="logo">🔥 Apex <span>Holux</span></div>
<nav>
<a href="#">Home</a>
<a href="#shop">Shop</a>
<a href="#cart">Cart</a>
<a onclick="openLogin()">Account</a>
</nav>
</header>

<section class="hero">
<div>
<h1>GLOBAL <span>PRO MARKET</span></h1>
<p>Premium Sneakers • Slides • Sketchers • QD Sandals</p>
</div>
</section>

<input class="search" placeholder="Search products..." oninput="search(this.value)">

<section class="products" id="shop"></section>

<section class="cart" id="cart">
<h2>🛒 Cart</h2>
<div id="cartItems"></div>
<div class="total">Total: $<span id="total">0</span></div>

<div class="pay">
<h3>💳 Payment Method</h3>
<button onclick="pay()">Pay via WhatsApp Order</button>
</div>
</section>

<!-- LOGIN -->
<div class="loginBox" id="loginBox">
<h3>👤 Account</h3>
<input id="user" placeholder="Username">
<input id="pass" placeholder="Password">
<button onclick="login()">Login / Register</button>
</div>

<a class="whatsapp" href="https://wa.me/93764594322">💬</a>

<script>

let products=[
{name:"Nike Air Force 1",price:90,img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff"},
{name:"Jordan Retro 4",price:180,img:"https://images.unsplash.com/photo-1600180758890-6b94519a8ba6"},
{name:"Adidas Ultraboost",price:120,img:"https://images.unsplash.com/photo-1528701800489-20be3c5c9c8c"},
{name:"Sketchers Foam",price:95,img:"https://images.unsplash.com/photo-1519741497674-611481863552"}
];

let cart=[];
let total=0;
let user=null;

function render(list=products){
let box=document.getElementById("shop");
box.innerHTML="";
list.forEach((p,i)=>{
box.innerHTML+=`
<div class="card">
<img src="${p.img}">
<div class="info">
<h3>${p.name}</h3>
<div class="price">$${p.price}</div>
<button class="btn" onclick="add(${i})">Add</button>
</div>
</div>`;
});
}
render();

function add(i){
cart.push(products[i]);
total+=products[i].price;
update();
}

function update(){
document.getElementById("cartItems").innerHTML=cart.map(c=>`✔ ${c.name} - $${c.price}`).join("<br>");
document.getElementById("total").innerText=total;
}

function search(v){
render(products.filter(p=>p.name.toLowerCase().includes(v.toLowerCase())));
}

/* LOGIN */
function openLogin(){
document.getElementById("loginBox").style.display="block";
}

function login(){
let u=document.getElementById("user").value;
let p=document.getElementById("pass").value;

if(!u||!p){alert("Fill");return;}

localStorage.setItem("user",u);
user=u;

alert("Welcome "+u);
document.getElementById("loginBox").style.display="none";
}

/* PAYMENT */
function pay(){
if(cart.length==0){alert("Cart empty");return;}

let msg="ORDER:\n";
cart.forEach(i=>{
msg+=i.name+" - $"+i.price+"\n";
});
msg+="Total: $"+total;

window.open("https://wa.me/93764594322?text="+encodeURIComponent(msg));
}

</script>

</body>
</html>
