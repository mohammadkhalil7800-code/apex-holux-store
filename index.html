<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌍 Apex Holux Global Market</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f5f5f5;
color:#111;
}

/* HEADER */

header{
background:#0f172a;
color:white;
padding:20px;
position:sticky;
top:0;
z-index:999;
box-shadow:0 4px 10px rgba(0,0,0,0.3);
}

.logo{
font-size:32px;
font-weight:bold;
text-align:center;
}

.logo span{
color:#ff9900;
}

.nav{
display:flex;
justify-content:center;
gap:20px;
margin-top:10px;
flex-wrap:wrap;
}

.nav a{
color:white;
text-decoration:none;
font-size:15px;
}

.search-box{
display:flex;
justify-content:center;
margin-top:15px;
}

.search{
width:90%;
max-width:700px;
padding:12px;
border:none;
border-radius:10px;
font-size:16px;
}

/* HERO */

.hero{
height:350px;
background:url('https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=1200') center/cover;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
color:white;
}

.hero-box{
background:rgba(0,0,0,0.6);
padding:30px;
border-radius:20px;
}

.hero h1{
font-size:45px;
margin-bottom:10px;
}

.hero p{
font-size:18px;
}

/* FILTERS */

.filters{
padding:20px;
text-align:center;
}

.filters button{
padding:10px 18px;
border:none;
margin:5px;
background:#ff9900;
color:white;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

/* PRODUCTS */

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:20px;
padding:20px;
}

.card{
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 4px 15px rgba(0,0,0,0.1);
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.info{
padding:15px;
}

.badge{
background:red;
color:white;
padding:5px 10px;
border-radius:20px;
font-size:12px;
display:inline-block;
margin-bottom:10px;
}

.info h3{
margin-bottom:10px;
font-size:20px;
}

.price{
font-size:22px;
font-weight:bold;
margin-bottom:10px;
color:#ff6600;
}

.cart-btn{
width:100%;
padding:12px;
border:none;
background:#0f172a;
color:white;
border-radius:10px;
font-size:16px;
cursor:pointer;
}

/* CART */

.cart{
background:white;
margin:20px;
padding:20px;
border-radius:20px;
box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

.cart h2{
margin-bottom:15px;
}

#cartItems p{
margin:8px 0;
}

.checkout{
margin-top:15px;
padding:15px;
width:100%;
border:none;
background:green;
color:white;
font-size:18px;
border-radius:12px;
cursor:pointer;
}

/* FOOTER */

footer{
background:#0f172a;
color:white;
padding:40px 20px;
text-align:center;
margin-top:30px;
}

footer h2{
margin-bottom:10px;
}

.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
color:white;
padding:16px;
border-radius:50%;
font-size:28px;
text-decoration:none;
}

</style>
</head>

<body>

<header>

<div class="logo">
🔥 Apex <span>Holux</span>
</div>

<div class="nav">
<a href="#">Home</a>
<a href="#">Shop</a>
<a href="#">Trending</a>
<a href="#">Global</a>
<a href="#">Contact</a>
</div>

<div class="search-box">
<input class="search" placeholder="Search Fashion Products..."
oninput="searchProducts(this.value)">
</div>

</header>

<section class="hero">
<div class="hero-box">
<h1>🌍 GLOBAL FASHION MARKET</h1>
<p>Luxury Sneakers • Slides • Sandals • Fashion Shoes</p>
</div>
</section>

<div class="filters">
<button onclick="filterProducts('all')">All</button>
<button onclick="filterProducts('sneaker')">Sneakers</button>
<button onclick="filterProducts('slides')">Slides</button>
<button onclick="filterProducts('sandal')">Sandals</button>
<button onclick="filterProducts('sport')">Sport</button>
</div>

<section class="products" id="products"></section>

<div class="cart">

<h2>🛒 Shopping Cart</h2>

<div id="cartItems"></div>

<h3>Total: $<span id="total">0</span></h3>

<button class="checkout" onclick="checkout()">
Order on WhatsApp
</button>

</div>

<footer>

<h2>🔥 Apex Holux Global Trading</h2>

<p>Worldwide Fashion Market</p>

<br>

<p>📞 WhatsApp: 0764 594 322</p>

<p>🌍 Global Premium Products</p>

</footer>

<a class="whatsapp"
href="https://wa.me/93764594322">💬</a>

<script>

const PHONE = "93764594322";

const products = [

{

},

},

{

},

},

{

}

];

let cart = [];
let total = 0;

function renderProducts(list){

const box = document.getElementById("products");

box.innerHTML = "";

list.forEach(p=>{

box.innerHTML += `

<div class="card">

<img src="${p.img}"
loading="lazy"
onerror="this.src='https://via.placeholder.com/300?text=Fashion+Product'">

<div class="info">

<div class="badge">🔥 Best Seller</div>

<h3>${p.name}</h3>

<div class="price">$${p.price}</div>

<button class="cart-btn"
onclick="addToCart('${p.name}',${p.price})">
Add To Cart
</button>

</div>

</div>

`;

});

}

renderProducts(products);

function addToCart(name,price){

cart.push({name,price});

total += price;

document.getElementById("cartItems").innerHTML += `
<p>✔ ${name} - $${price}</p>
`;

document.getElementById("total").innerText = total;

}

function filterProducts(cat){

if(cat==="all"){
renderProducts(products);
return;
}

renderProducts(products.filter(p=>p.cat===cat));

}

function searchProducts(val){

renderProducts(
products.filter(p=>
p.name.toLowerCase().includes(val.toLowerCase())
)
);

}

function checkout(){

if(cart.length===0){
alert("Cart is empty!");
return;
}

let msg = "🔥 APEX HOLUX ORDER 🔥\n\n";

cart.forEach(i=>{
msg += "✔ " + i.name + " - $" + i.price + "\n";
});

msg += "\nTotal: $" + total;

window.open(
"https://wa.me/" + PHONE +
"?text=" + encodeURIComponent(msg)
);

}
