<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAosKE91uRDcGettjknNTu7wNjVmdtpPvA",
  authDomain: "apex-holux-global-store.firebaseapp.com",
  projectId: "apex-holux-global-store",
  storageBucket: "apex-holux-global-store.firebasestorage.app",
  messagingSenderId: "14825121288",
  appId: "1:14825121288:web:a46ba39d55894efa0453bd"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let products = [];
let cart = [];
let total = 0;

/* 🔥 LOAD FIREBASE PRODUCTS */
async function loadProducts(){
  const snapshot = await getDocs(collection(db, "products"));

  products = [];

  snapshot.forEach(doc=>{
    const d = doc.data();

    products.push({
      name: d.name,
      price: Number(d.price),
      cat: (d.category || "").toLowerCase(),
      img: d.image
    });
  });

  render(products);
}

loadProducts();

/* 🔥 SHOW PRODUCTS */
function render(list){
  const box = document.getElementById("products");
  box.innerHTML = "";

  list.forEach(p=>{
    box.innerHTML += `
      <div class="card">
        <img src="${p.img}">
        <h3>${p.name}</h3>
        <p>$${p.price}</p>
        <button onclick="add('${p.name}',${p.price})">Add to Cart</button>
      </div>
    `;
  });
}

/* 🛒 CART */
function add(name,price){
  cart.push({name,price});
  total += price;

  document.getElementById("cart").innerHTML += `<p>${name}</p>`;
  document.getElementById("total").innerText = total;
}

/* 🔍 SEARCH */
function searchProducts(val){
  render(products.filter(p =>
    p.name.toLowerCase().includes(val.toLowerCase())
  ));
}

/* 📦 FILTER */
function filter(cat){
  if(cat === "all") return render(products);
  render(products.filter(p => p.cat === cat));
}

/* 💬 WHATSAPP ORDER */
function checkout(){
  if(cart.length === 0){
    alert("Cart empty!");
    return;
  }

  let msg = "🛒 ORDER:\n";
  cart.forEach(i => msg += i.name + "\n");
  msg += "Total: $" + total;

  window.open("https://wa.me/93764594322?text=" + encodeURIComponent(msg));
}

/* expose */
window.add = add;
window.searchProducts = searchProducts;
window.filter = filter;
window.checkout = checkout;

</script>
