<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>🌍 Apex Holux GOD MODE STORE</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#0f172a;
color:white;
}

/* HEADER */

header{
background:#020617;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
}

.logo{
font-size:28px;
font-weight:bold;
color:#f59e0b;
}

nav a{
color:white;
text-decoration:none;
margin:10px;
}

/* HERO */

.hero{
padding:50px 20px;
text-align:center;
background:linear-gradient(90deg,#020617,#1e293b);
}

.hero h1{
font-size:40px;
margin-bottom:10px;
}

.hero p{
color:#cbd5e1;
}

.hero button{
margin-top:20px;
}

/* BUTTON */

button{
background:#f59e0b;
border:none;
padding:10px 15px;
cursor:pointer;
border-radius:5px;
font-weight:bold;
}

/* SEARCH */

.search-box{
text-align:center;
padding:20px;
}

.search-box input{
width:80%;
max-width:500px;
padding:12px;
border:none;
border-radius:8px;
}

/* PRODUCTS */

.container{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
gap:15px;
padding:20px;
}

.card{
background:#1e293b;
padding:10px;
border-radius:12px;
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
border-radius:10px;
}

.price{
color:#fbbf24;
font-size:20px;
margin:5px 0;
}

/* CART */

.cart{
background:#020617;
margin:20px;
padding:20px;
border-radius:10px;
}

.cart-item{
display:flex;
justify-content:space-between;
margin:10px 0;
}

/* ADMIN */

.admin{
background:#111827;
margin:20px;
padding:20px;
border-radius:10px;
}

.admin input{
padding:10px;
margin:5px;
width:100%;
border:none;
border-radius:6px;
}

/* FOOTER */

footer{
background:#000;
text-align:center;
padding:20px;
margin-top:30px;
color:#94a3b8;
}

</style>
</head>

<body>

<header>

<div class="logo">🔥 Apex Holux</div>

<nav>
<a href="#">Home</a>
<a href="#">Shop</a>
<a href="#">Brands</a>
<a href="#">Contact</a>
</nav>

</header>

<!-- HERO -->

<section class="hero">

<h1>🌍 Global Premium Store</h1>

<p>
Top Trending Sneakers • Slides • Boots • Fashion
</p>

<button onclick="scrollToProducts()">
Shop Now
</button>

</section>

<!-- SEARCH -->

<div class="search-box">
<input placeholder="Search products..."
oninput="search(this.value)">
</div>

<!-- PRODUCTS -->

<div class="container" id="products"></div>

<!-- CART -->

<div class="cart">

<h2>🛒 Shopping Cart</h2>

<div id="cart"></div>

<h3>Total: $<span id="total">0</span></h3>

<button onclick="checkout()">
Order WhatsApp
</button>

</div>

<!-- ADMIN PANEL -->

<div class="admin">

<h2>⚙️ Admin Panel</h2>

<input id="name" placeholder="Product name">

<input id="price" placeholder="Price">

<input id="img" placeholder="Image URL">

<button onclick="addProduct()">
Add Product
</button>

</div>

<footer>

📞 WhatsApp: 0764594322 <br>
🌐 Apex Holux Global Trading

</footer>

<script>

/* PHONE */

const PHONE="93764594322";

/* PRODUCTS */

let products=[

{
name:"Nike Air Force 1",
price:90,
img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"
},

{
name:"Adidas Ultraboost",
price:120,
img:"https://images.unsplash.com/photo-1528701800489-20be3c5c9c8c?w=500"
},

{
name:"Jordan Retro 4",
price:180,
img:"https://images.unsplash.com/photo-1600180758890-6b94519a8ba6?w=500"
},

{
name:"Puma RS-X",
price:95,
img:"https://images.unsplash.com/photo-1606813907291-d86efa9b94db?w=500"
},

{
name:"Premium Slides",
price:40,
img:"https://images.unsplash.com/photo-1597047084897-51e81819a499?w=500"
},

{
name:"Leather Boots",
price:110,
img:"https://images.unsplash.com/photo-1600185365483?w=500"
}

];

/* CART */

let cart=[];

/* RENDER */

function render(list=products){

const box=document.getElementById("products");

box.innerHTML="";

list.forEach((p,i)=>{

box.innerHTML+=`

<div class="card">

<img 
src="${p.img}" 
loading="lazy"
onerror="this.src='https://via.placeholder.com/250?text=Product'">

<h3>${p.name}</h3>

<p class="price">$${p.price}</p>

<button onclick="add(${i})">
Add To Cart
</button>

</div>

`;

});

}

render();

/* ADD CART */

function add(i){

cart.push(products[i]);

showCart();

}

/* SHOW CART */

function showCart(){

const cartBox=document.getElementById("cart");

cartBox.innerHTML="";

let total=0;

cart.forEach((item,index)=>{

total+=item.price;

cartBox.innerHTML+=`

<div class="cart-item">

<span>${item.name}</span>

<button onclick="removeItem(${index})">
❌
</button>

</div>

`;

});

document.getElementById("total").innerText=total;

}

/* REMOVE */

function removeItem(i){

cart.splice(i,1);

showCart();

}

/* SEARCH */

function search(val){

const filtered=products.filter(p=>

p.name.toLowerCase()
.includes(val.toLowerCase())

);

render(filtered);

}

/* CHECKOUT */

function checkout(){

if(cart.length===0){

alert("Cart Empty!");

return;

}

let msg="🛒 APEX HOLUX ORDER %0A";

cart.forEach(i=>{

msg+=i.name+"%0A";

});

window.open(
"https://wa.me/"+PHONE+"?text="+msg
);

}

/* ADD PRODUCT */

function addProduct(){

const name=
document.getElementById("name").value;

const price=
document.getElementById("price").value;

const img=
document.getElementById("img").value;

if(!name || !price || !img){

alert("Fill all fields");

return;

}

products.push({

name,
price:Number(price),
img

});

render();

alert("🔥 Product Added");

}

/* SCROLL */

function scrollToProducts(){

window.scrollTo({

top:500,
behavior:"smooth"

});

}

</script>

</body>
</html>
