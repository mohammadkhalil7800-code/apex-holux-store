<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Apex Holux Global Store</title>

<style>
body { font-family: Arial; background:#f3f3f3; margin:0; }
header { background:#131921; color:white; padding:15px; display:flex; justify-content:space-between; }
#products { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:15px; padding:20px; }
.card { background:white; padding:10px; border-radius:10px; text-align:center; }
.card img { width:100%; height:150px; object-fit:cover; }
button { padding:8px; margin:5px; border:none; cursor:pointer; }
.buy { background:orange; }
.cart { background:#ffd814; }
#cartBox { background:white; margin:20px; padding:15px; }
</style>

</head>

<body>

<header>
  <h2>🌍 Apex Holux Global Store</h2>
  <input id="search" placeholder="Search products...">
</header>

<div id="products">Loading...</div>

<div id="cartBox">
  <h3>🛒 Cart</h3>
  <div id="cart"></div>
  <h3>Total: $<span id="total">0</span></h3>
  <button onclick="checkout()">Checkout</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* 🔥 PUT YOUR FIREBASE CONFIG HERE */
const firebaseConfig = {
  apiKey: "PUT_YOUR_KEY",
  authDomain: "apex-holux-global-store.firebaseapp.com",
  projectId: "apex-holux-global-store"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let products = [];
let cart = [];

/* 🔥 LOAD PRODUCTS FROM FIREBASE */
async function loadProducts(){
  const snap = await getDocs(collection(db,"products"));

  products = [];

  snap.forEach(doc=>{
    products.push({ id:doc.id, ...doc.data() });
  });

  render(products);
}

/* 🎯 SHOW PRODUCTS */
function render(list){
  const box = document.getElementById("products");
  box.innerHTML = "";

  list.forEach(p=>{
    box.innerHTML += `
      <div class="card">
        <img src="${p.image || 'https://via.placeholder.com/150'}">
        <h4>${p.name}</h4>
        <p>$${p.price}</p>

        <button class="buy" onclick="buyNow('${p.id}')">Buy Now</button>
        <button class="cart" onclick="addCart('${p.id}')">Add Cart</button>
      </div>
    `;
  });
}

/* 🛒 ADD CART */
window.addCart = function(id){
  let item = cart.find(x=>x.id===id);
  let p = products.find(x=>x.id===id);

  if(item) item.qty++;
  else cart.push({...p,qty:1});

  renderCart();
}

/* ⚡ BUY NOW */
window.buyNow = function(id){
  cart = [];
  addCart(id);
  checkout();
}

/* 🧾 CART */
function renderCart(){
  let total = 0;
  let html = "";

  cart.forEach(i=>{
    total += i.price*i.qty;
    html += `<p>${i.name} x${i.qty} = $${i.price*i.qty}</p>`;
  });

  document.getElementById("cart").innerHTML = html;
  document.getElementById("total").innerText = total;
}

/* 📲 ORDER SYSTEM */
window.checkout = function(){

  if(cart.length===0) return alert("Cart empty");

  let msg="🛒 ORDER\n";

  cart.forEach(i=>{
    msg+=`${i.name} x${i.qty}\n`;
  });

  window.open("https://wa.me/93764594322?text="+encodeURIComponent(msg));
}

/* 🔍 SEARCH */
document.getElementById("search").oninput = (e)=>{
  let val = e.target.value.toLowerCase();
  let filtered = products.filter(p=>p.name.toLowerCase().includes(val));
  render(filtered);
}

loadProducts();

</script>

</body>
</html>
