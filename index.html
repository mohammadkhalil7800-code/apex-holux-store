<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apex Holux Admin Store</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Montserrat;
background:#0a0a0a;
color:white;
}

header{
padding:20px;
background:#000;
display:flex;
justify-content:space-between;
}

.logo{
font-size:26px;
font-weight:900;
}

.logo span{color:#ff9900;}

.container{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
padding:20px;
}

.panel{
background:#111;
padding:20px;
border-radius:15px;
}

input{
width:100%;
padding:10px;
margin:5px 0;
border:none;
border-radius:10px;
}

button{
width:100%;
padding:10px;
background:#ff9900;
border:none;
font-weight:bold;
border-radius:10px;
cursor:pointer;
margin-top:10px;
}

button:hover{background:white;}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
padding:20px;
}

.card{
background:#111;
padding:15px;
border-radius:15px;
}

.card img{
width:100%;
height:150px;
object-fit:cover;
border-radius:10px;
}

.price{
color:#ff9900;
font-weight:800;
}

.small{
font-size:12px;
opacity:0.7;
}

</style>
</head>

<body>

<header>
<div class="logo">Apex <span>Holux Admin</span></div>
<div>Global System</div>
</header>

<div class="container">

<!-- ADMIN PANEL -->
<div class="panel">
<h2>➕ Add Product</h2>

<input id="name" placeholder="Product Name">
<input id="price" placeholder="Price">
<input id="img" placeholder="Image URL">
<input id="cat" placeholder="Category (sneaker/slides)">

<button onclick="addProduct()">Add Product</button>
<p class="small">This works like Amazon admin panel</p>
</div>

<!-- CART -->
<div class="panel">
<h2>🛒 Cart</h2>
<div id="cart"></div>
<p>Total: $<span id="total">0</span></p>
<button onclick="checkout()">WhatsApp Order</button>
</div>

</div>

<!-- PRODUCTS -->
<div class="products" id="box"></div>

<script>

let products=[
{name:"Nike Air Force",price:120,cat:"sneaker",img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=700"},
{name:"Adidas Slides",price:60,cat:"slides",img:"https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?w=700"}
];

let cart=[];
let total=0;

function show(){
let box=document.getElementById("box");
box.innerHTML="";

products.forEach((p,i)=>{
box.innerHTML+=`
<div class="card">
<img src="${p.img}">
<h3>${p.name}</h3>
<div class="price">$${p.price}</div>
<p class="small">${p.cat}</p>

<button onclick="add(${i})">Add to Cart</button>
<button onclick="removeProduct(${i})" style="background:red;color:white;">Delete</button>
</div>`;
});
}

function add(i){
cart.push(products[i]);
updateCart();
}

function updateCart(){
let c=document.getElementById("cart");
c.innerHTML="";
total=0;

cart.forEach(i=>{
total+=i.price;
c.innerHTML+=i.name+"<br>";
});

document.getElementById("total").innerText=total;
}

function addProduct(){

let n=document.getElementById("name").value;
let p=document.getElementById("price").value;
let img=document.getElementById("img").value;
let cat=document.getElementById("cat").value;

if(!n||!p||!img||!cat){
alert("Fill all fields!");
return;
}

products.push({
name:n,
price:Number(p),
img:img,
cat:cat
});

show();
alert("Product Added!");
}

function removeProduct(i){
products.splice(i,1);
show();
}

function checkout(){

let msg="ORDER:\n";
cart.forEach(i=>{
msg+=i.name+" - $"+i.price+"\n";
});

window.open("https://wa.me/93764594322?text="+encodeURIComponent(msg));
}

show();

</script>

</body>
</html>
