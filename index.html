<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>🔥 Apex Holux BOSS Store</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

/* HEADER */
header{
background:#020617;
padding:15px;
text-align:center;
}

/* GRID */
.container{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:15px;
padding:15px;
}

/* CARD */
.card{
background:#1e293b;
padding:10px;
border-radius:10px;
text-align:center;
}

.card img{
width:100%;
height:150px;
object-fit:cover;
border-radius:8px;
}

/* ADMIN PANEL */
.admin{
background:#020617;
padding:15px;
margin:15px;
border-radius:10px;
}

input{
padding:8px;
margin:5px;
border:none;
border-radius:5px;
}

button{
background:#f59e0b;
border:none;
padding:8px;
cursor:pointer;
margin:5px;
}
</style>

</head>

<body>

<header>
<h2>🔥 Apex Holux BOSS STORE</h2>
</header>

<!-- ADMIN PANEL -->
<div class="admin">
<h3>⚙️ Add Product (Admin)</h3>

<input id="name" placeholder="Product Name">
<input id="price" placeholder="Price">
<input id="img" placeholder="Image URL">

<button onclick="addProduct()">Add Product</button>
</div>

<!-- PRODUCTS -->
<div class="container" id="products"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 🔥 PUT YOUR FIREBASE CONFIG HERE */
const firebaseConfig = {
apiKey: "YOUR_KEY",
authDomain: "YOUR_DOMAIN",
projectId: "YOUR_PROJECT_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const box = document.getElementById("products");

/* 🔥 REALTIME PRODUCTS */
onSnapshot(collection(db,"products"), (snapshot)=>{
box.innerHTML="";

snapshot.forEach(doc=>{
const p = doc.data();

box.innerHTML+=`
<div class="card">
<img src="${p.img}" onerror="this.src='https://via.placeholder.com/200'">
<h3>${p.name}</h3>
<p>$${p.price}</p>
<button onclick="order('${p.name}')">Order</button>
</div>
`;
});
});

/* ➕ ADD PRODUCT */
window.addProduct = async function(){

const name=document.getElementById("name").value;
const price=document.getElementById("price").value;
const img=document.getElementById("img").value;

if(!name || !price || !img){
alert("Fill all fields!");
return;
}

await addDoc(collection(db,"products"),{
name:name,
price:Number(price),
img:img
});

alert("Product Added 🔥");
}

/* 📲 ORDER */
window.order = function(name){
let msg="🛒 Order: "+name;
window.open("https://wa.me/93764594322?text="+encodeURIComponent(msg));
}

</script>

</body>
</html>
