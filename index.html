<!-- 🔥 APEX HOLUX ULTRA NEXT LEVEL GLOBAL SYSTEM -->

<!-- ADD THIS INSIDE <head> -->

<style>

/* ULTRA PREMIUM EFFECTS */

body{
background:
radial-gradient(circle at top,#1a1a1a,#050505 60%);
}

/* GLASS NAVBAR */

header{
background:rgba(0,0,0,0.55);
backdrop-filter:blur(20px);
box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

/* HERO ANIMATION */

.hero::before{
content:'';
position:absolute;
width:100%;
height:100%;
background:
linear-gradient(120deg,
rgba(255,153,0,0.15),
transparent,
rgba(255,255,255,0.05));
animation:moveBg 8s linear infinite;
}

@keyframes moveBg{
0%{transform:translateX(-100%)}
100%{transform:translateX(100%)}
}

.hero-content{
position:relative;
z-index:2;
}

.hero-content h1{
font-size:95px;
text-shadow:0 0 35px rgba(255,153,0,0.4);
animation:fadeUp 1s ease;
}

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(50px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* PREMIUM BUTTON */

.hero-btn{
background:linear-gradient(135deg,#ff9900,#ff5e00);
box-shadow:0 10px 25px rgba(255,153,0,0.4);
}

.hero-btn:hover{
transform:scale(1.08) rotate(-1deg);
}

/* PRODUCT CARD ULTRA */

.card{
background:
linear-gradient(145deg,#101010,#0a0a0a);
border:1px solid rgba(255,255,255,0.05);
overflow:hidden;
}

.card::before{
content:'';
position:absolute;
top:0;
left:-120%;
width:100%;
height:100%;
background:
linear-gradient(
90deg,
transparent,
rgba(255,255,255,0.08),
transparent
);
transition:0.7s;
}

.card:hover::before{
left:120%;
}

.card:hover{
transform:
translateY(-15px)
scale(1.03);
box-shadow:
0 25px 50px rgba(0,0,0,0.7),
0 0 30px rgba(255,153,0,0.15);
}

.card img{
transition:0.6s;
}

.card:hover img{
transform:scale(1.12);
}

/* PREMIUM PRICE */

.price{
font-size:36px;
background:linear-gradient(135deg,#ff9900,#ffd000);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* BUTTON GLOW */

.btn{
background:
linear-gradient(135deg,#ff9900,#ff5e00);
box-shadow:0 10px 25px rgba(255,153,0,0.25);
}

.btn:hover{
transform:scale(1.05);
box-shadow:0 15px 35px rgba(255,153,0,0.5);
}

/* SEARCH PREMIUM */

.search{
background:#111;
color:white;
border:1px solid rgba(255,255,255,0.06);
box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

/* FILTERS */

.filters button{
background:#111;
border:1px solid rgba(255,255,255,0.06);
}

.filters button:hover{
transform:translateY(-3px);
}

/* ADMIN PANEL ULTRA */

.admin{
background:
linear-gradient(145deg,#111,#0b0b0b);
border:1px solid rgba(255,255,255,0.06);
box-shadow:0 20px 45px rgba(0,0,0,0.5);
}

.admin input{
background:#181818;
color:white;
border:1px solid rgba(255,255,255,0.05);
}

.admin input:focus{
outline:none;
border:1px solid #ff9900;
}

/* DASHBOARD */

.dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
padding:70px 6%;
}

.dash-box{
background:
linear-gradient(145deg,#111,#0b0b0b);
padding:40px;
border-radius:28px;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,0.45);
transition:0.4s;
}

.dash-box:hover{
transform:translateY(-10px);
}

.dash-box h2{
font-size:55px;
color:#ff9900;
margin-bottom:15px;
}

/* LIVE BADGE */

.live{
position:fixed;
top:100px;
right:20px;
background:red;
padding:12px 18px;
border-radius:40px;
font-weight:900;
box-shadow:0 10px 20px rgba(255,0,0,0.4);
animation:pulse 1s infinite;
z-index:999;
}

@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.08)}
100%{transform:scale(1)}
}

/* PREMIUM FOOTER */

footer{
background:
linear-gradient(180deg,#050505,#000);
}

footer h1{
font-size:60px;
}

/* MOBILE */

@media(max-width:768px){

.hero-content h1{
font-size:52px;
}

.hero-content p{
font-size:16px;
}

.products{
grid-template-columns:1fr;
}

}

</style>

<!-- ADD THIS AFTER HERO SECTION -->

<div class="live">
🔴 LIVE GLOBAL MARKET
</div>

<!-- ADD THIS BEFORE FOOTER -->

<section class="dashboard">

<div class="dash-box">
<h2 id="productCount">0</h2>
<p>Total Products</p>
</div>

<div class="dash-box">
<h2 id="cartCount">0</h2>
<p>Cart Items</p>
</div>

<div class="dash-box">
<h2 id="orderCount">24K+</h2>
<p>Global Orders</p>
</div>

<div class="dash-box">
<h2 id="visitorCount">1M+</h2>
<p>Monthly Visitors</p>
</div>

</section>

<!-- REPLACE YOUR JAVASCRIPT WITH THIS -->

<script>

const PHONE = "93764594322";

let products = JSON.parse(localStorage.getItem("products")) || [

{
name:"Nike Air Force 1",
price:90,
cat:"sneaker",
img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=700"
},

{
name:"Jordan Retro 4",
price:180,
cat:"sneaker",
img:"https://images.unsplash.com/photo-1600180758890-6b94519a8ba6?w=700"
},

{
name:"Adidas Ultraboost",
price:120,
cat:"sport",
img:"https://images.unsplash.com/photo-1528701800489-20be3c5c9c8c?w=700"
},

{
name:"Sketchers Max Cushion",
price:105,
cat:"sport",
img:"https://images.unsplash.com/photo-1549298916-b41d501d3772?w=700"
},

{
name:"Nike Slides",
price:45,
cat:"slides",
img:"https://images.unsplash.com/photo-1597047084897-51e81819a499?w=700"
},

{
name:"QD Premium Sandal",
price:60,
cat:"sandal",
img:"https://images.unsplash.com/photo-1608256246200-53e8b47b2f80?w=700"
}

];

let cart = JSON.parse(localStorage.getItem("cart")) || [];

let total = 0;

/* RENDER PRODUCTS */

function renderProducts(list){

const box = document.getElementById("shop");

box.innerHTML = "";

list.forEach((p,index)=>{

box.innerHTML += `

<div class="card">

<div class="badge">
🔥 BEST SELLER
</div>

<img src="${p.img}" loading="lazy">

<div class="info">

<h2>${p.name}</h2>

<div class="price">
$${p.price}
</div>

<div class="desc">
World class premium fashion product with luxury quality and trending global design.
</div>

<button class="btn"
onclick="addToCart('${p.name}',${p.price})">
Add To Cart
</button>

<br><br>

<button class="btn"
style="background:red;color:white"
onclick="removeProduct(${index})">
Remove Product
</button>

</div>

</div>

`;

});

updateDashboard();

}

/* ADD TO CART */

function addToCart(name,price){

cart.push({name,price});

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

renderCart();

}

/* RENDER CART */

function renderCart(){

const box = document.getElementById("cartItems");

box.innerHTML = "";

total = 0;

cart.forEach(i=>{

total += i.price;

box.innerHTML += `
<p>✔ ${i.name} - $${i.price}</p>
`;

});

document.getElementById("total").innerText = total;

updateDashboard();

}

renderCart();

/* SEARCH */

function searchProducts(val){

renderProducts(
products.filter(p=>
p.name.toLowerCase().includes(val.toLowerCase())
)
);

}

/* FILTER */

function filterProducts(cat){

if(cat==="all"){

renderProducts(products);
return;

}

renderProducts(
products.filter(p=>p.cat===cat)
);

}

/* CHECKOUT */

function checkout(){

if(cart.length===0){

alert("Cart Empty!");
return;

}

let msg =
"🔥 APEX HOLUX GLOBAL ORDER 🔥\n\n";

cart.forEach(i=>{

msg +=
"✔ " + i.name +
" - $" + i.price + "\n";

});

msg += "\n💰 Total: $" + total;

window.open(
"https://wa.me/" +
PHONE +
"?text=" +
encodeURIComponent(msg)
);

}

/* ADMIN */

function addProduct(){

const name =
document.getElementById("pname").value;

const price =
Number(document.getElementById("pprice").value);

const img =
document.getElementById("pimg").value;

const cat =
document.getElementById("pcat").value;

if(!name || !price || !img || !cat){

alert("Fill all fields");
return;

}

products.push({
name,
price,
img,
cat
});

localStorage.setItem(
"products",
JSON.stringify(products)
);

renderProducts(products);

alert("✅ Product Added");

pname.value="";
pprice.value="";
pimg.value="";
pcat.value="";

}

/* REMOVE */

function removeProduct(index){

products.splice(index,1);

localStorage.setItem(
"products",
JSON.stringify(products)
);

renderProducts(products);

}

/* DASHBOARD */

function updateDashboard(){

document.getElementById(
"productCount"
).innerText = products.length;

document.getElementById(
"cartCount"
).innerText = cart.length;

}

/* START */

renderProducts(products);

</script>
