<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Afghan Global Market</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800;900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Montserrat,sans-serif}
body{background:#050505;color:#fff}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 6%;
background:rgba(0,0,0,0.85);
position:sticky;
top:0;
z-index:1000;
backdrop-filter:blur(10px);
}
.logo{font-size:26px;font-weight:900}
.logo span{color:#ff9800}
nav a{color:#fff;margin:0 10px;text-decoration:none}
nav a:hover{color:#ff9800}

/* HERO */
.hero{
height:90vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
background:
linear-gradient(rgba(0,0,0,0.7),#000),
url('https://images.unsplash.com/photo-1600180758890-6b94519a8ba6') center/cover;
padding:20px;
}
.hero h1{font-size:60px;font-weight:900}
.hero span{color:#ff9800}
.hero p{opacity:0.8;margin-top:15px}
.btn{
margin-top:20px;
padding:14px 40px;
background:#ff9800;
border:none;
border-radius:30px;
font-weight:900;
cursor:pointer;
}

/* PRODUCTS */
.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:60px 6%;
}

.card{
background:#111;
border-radius:18px;
overflow:hidden;
transition:0.3s;
}
.card:hover{transform:translateY(-10px)}
.card img{width:100%;height:220px;object-fit:cover}
.info{padding:15px}
.price{color:#ff9800;font-weight:900;font-size:20px}
.buy{
width:100%;
padding:12px;
background:#ff9800;
border:none;
border-radius:10px;
font-weight:900;
cursor:pointer;
}

/* CART */
.cart{
padding:50px 6%;
background:#0c0c0c;
}
.cart-item{
display:flex;
justify-content:space-between;
padding:10px 0;
border-bottom:1px solid #222;
}
.total{font-size:26px;color:#ff9800;margin-top:15px}

/* LOGIN */
.login{
padding:60px 6%;
background:#0a0a0a;
text-align:center;
}
.login input{
width:90%;
max-width:400px;
padding:12px;
margin:8px 0;
border:none;
border-radius:10px;
}

/* CHECKOUT */
.checkout{
padding:50px 6%;
background:#111;
margin-top:20px;
border-radius:20px;
}
.paybox{
background:#0a0a0a;
padding:20px;
border-radius:15px;
margin-top:15px;
}

/* WHATSAPP */
.whatsapp{
position:fixed;
bottom:20px;
right:20px;
width:60px;
height:60px;
background:#25D366;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
text-decoration:none;
color:white;
}
</style>
</head>

<body>

<header>
<div class="logo">🔥 Afghan <span>Global</span></div>
<nav>
<a href="#shop">Shop</a>
<a href="#cart">Cart</a>
<a href="#login">Account</a>
</nav>
</header>

<section class="hero">
<div>
<h1>AFGHAN <span>GLOBAL MARKET</span></h1>
<p>Top Products in Afghanistan + Global Trending Items</p>
<button class="btn">Start Shopping</button>
</div>
</section>

<!-- PRODUCTS -->
<section class="products" id="shop"></section>

<!-- CART -->
<section class="cart" id="cart">
<h2>🛒 Cart</h2>
<div id="cartItems"></div>
<div class="total">Total: $<span id="total">0</span></div>
</section>

<!-- LOGIN -->
<section class="login" id="login">
<h2>👤 Account Login</h2>
<input placeholder="Email">
<input placeholder="Password" type="password">
<button class="btn">Login</button>
</section>

<!-- CHECKOUT -->
<section class="checkout">
<h2>💳 Checkout System</h2>

<div class="paybox">
<p>✔ Cash on Delivery (Afghanistan)</p>
<p>✔ WhatsApp Order</p>
<p>✔ Card Payment (UI Demo)</p>
</div>

<button class="btn" onclick="checkout()">Order via WhatsApp</button>
</section>

<a class="whatsapp" href="https://wa.me/93764594322">💬</a>

<script>
let products=[
{name:"iPhone 14 Pro (Top Afghanistan)",price:850,img:"https://images.unsplash.com/photo-1510557880182-3d4d3cba35a5"},
{name:"Samsung Galaxy S23",price:780,img:"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9"},
{name:"Nike Air Force 1",price:90,img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff"},
{name:"Afghan Traditional Dress",price:60,img:"https://images.unsplash.com/photo-1520975922284-5c5a2c5b7d3d"},
{name:"Men Leather Shoes",price:75,img:"https://images.unsplash.com/photo-1525966222134-fcfa99b8ae77"},
{name:"Smart Watch Ultra",price:120,img:"https://images.unsplash.com/photo-1523275335684-37898b6baf30"}
];

let cart=[];

function render(){
let box=document.getElementById("shop");
box.innerHTML="";
products.forEach((p,i)=>{
box.innerHTML+=`
<div class="card">
<img src="${p.img}">
<div class="info">
<h3>${p.name}</h3>
<div class="price">$${p.price}</div>
<button class="buy" onclick="add(${i})">Add to Cart</button>
</div>
</div>`;
});
}
render();

function add(i){
cart.push(products[i]);
updateCart();
}

function updateCart(){
let box=document.getElementById("cartItems");
box.innerHTML="";
let total=0;

cart.forEach(p=>{
total+=p.price;
box.innerHTML+=`
<div class="cart-item">
<span>${p.name}</span>
<span>$${p.price}</span>
</div>`;
});

document.getElementById("total").innerText=total;
}

function checkout(){
let msg="🔥 AFGHAN GLOBAL ORDER 🔥\n\n";
let total=0;

cart.forEach(p=>{
msg+=p.name+" - $"+p.price+"\n";
total+=p.price;
});

msg+="\nTOTAL: $"+total;

window.open("https://wa.me/93764594322?text="+encodeURIComponent(msg));
}
</script>

</body>
</html>
