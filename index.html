<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apex Holux Global Domination Store</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800;900&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box;font-family:Montserrat,sans-serif}

body{
background:#070707;
color:white;
}

/* HEADER */

header{
position:fixed;
top:0;
width:100%;
padding:15px 6%;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(0,0,0,0.85);
backdrop-filter:blur(15px);
z-index:999;
border-bottom:1px solid #222;
}

.logo{
font-size:26px;
font-weight:900;
}

.logo span{color:#ff9900}

/* HERO */

.hero{
margin-top:80px;
padding:80px 6%;
text-align:center;
background:linear-gradient(rgba(0,0,0,0.8),rgba(0,0,0,0.9)),
url('https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=1600')
center/cover;
}

.hero h1{
font-size:55px;
font-weight:900;
}

.hero p{
opacity:0.8;
margin-top:10px;
}

/* SEARCH */

.search{
width:90%;
max-width:850px;
margin:30px auto;
display:block;
padding:15px;
border-radius:50px;
border:none;
background:#141414;
color:white;
outline:none;
}

/* FILTER */

.filters{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
margin-bottom:20px;
}

.filters button{
padding:10px 18px;
border:none;
border-radius:30px;
background:#1a1a1a;
color:white;
cursor:pointer;
font-weight:700;
}

.filters button:hover{
background:#ff9900;
color:black;
}

/* PRODUCTS */

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:40px 6%;
}

.card{
background:#151515;
border-radius:18px;
overflow:hidden;
transition:0.3s;
}

.card:hover{transform:scale(1.03)}

.card img{
width:100%;
height:200px;
object-fit:cover;
}

.card-body{
padding:15px;
}

.price{
color:#ff9900;
font-size:20px;
font-weight:800;
}

.btn{
width:100%;
margin-top:10px;
padding:10px;
border:none;
border-radius:10px;
background:#ff9900;
font-weight:900;
cursor:pointer;
}

/* CART */

.cart{
padding:40px 6%;
background:#111;
margin-top:40px;
border-top:1px solid #222;
}

.item{
display:flex;
justify-content:space-between;
padding:10px 0;
border-bottom:1px solid #222;
}

.total{
font-size:28px;
color:#ff9900;
margin-top:20px;
}

/* FLOAT */

.whatsapp{
position:fixed;
bottom:20px;
right:20px;
width:60px;
height:60px;
background:#25D366;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
text-decoration:none;
color:white;
}

</style>
</head>

<body>

<header>
<div class="logo">🔥 Apex <span>Holux</span></div>
</header>

<section class="hero">
<h1>GLOBAL DOMINATION STORE</h1>
<p>World-Class Ecommerce System • Built for Serious Business</p>
</section>

<input class="search" placeholder="Search products..." oninput="search(this.value)">

<div class="filters">
<button onclick="filter('all')">All</button>
<button onclick="filter('shoe')">Shoes</button>
<button onclick="filter('sport')">Sport</button>
<button onclick="filter('lux')">Luxury</button>
</div>

<section class="products" id="products"></section>

<section class="cart">
<h2>🛒 Cart System</h2>
<div id="cart"></div>
<div class="total">Total: $<span id="total">0</span></div>
<button class="btn" onclick="checkout()">Checkout WhatsApp</button>
</section>

<a class="whatsapp" href="https://wa.me/93764594322">💬</a>

<script>

const PHONE="93764594322";

const products=[
{name:"Nike Air Max Pro",price:120,cat:"shoe",img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=700"},
{name:"Adidas Ultra Boost",price:150,cat:"sport",img:"https://images.unsplash.com/photo-1528701800489-20be3c5c9c8c?w=700"},
{name:"Luxury Italian Leather",price:300,cat:"lux",img:"https://images.unsplash.com/photo-1614252369475-531eba835eb1?w=700"},
{name:"Sketchers Runner",price:110,cat:"sport",img:"https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?w=700"}
];

let cart=[];
let total=0;

function render(list){
let box=document.getElementById("products");
box.innerHTML="";
list.forEach((p,i)=>{
box.innerHTML+=`
<div class="card">
<img src="${p.img}">
<div class="card-body">
<h3>${p.name}</h3>
<div class="price">$${p.price}</div>
<button class="btn" onclick="add(${i})">Add to Cart</button>
</div>
</div>`;
});
}

render(products);

function add(i){
cart.push(products[i]);
total+=products[i].price;
update();
}

function update(){
let box=document.getElementById("cart");
box.innerHTML="";
cart.forEach(c=>{
box.innerHTML+=`
<div class="item">
<span>${c.name}</span>
<span>$${c.price}</span>
</div>`;
});
document.getElementById("total").innerText=total;
}

function search(v){
render(products.filter(p=>p.name.toLowerCase().includes(v.toLowerCase())));
}

function filter(c){
if(c==="all") return render(products);
render(products.filter(p=>p.cat===c));
}

function checkout(){
let msg="ORDER:\n";
cart.forEach(c=>msg+=c.name+" - $"+c.price+"\n");
msg+="TOTAL: $"+total;
window.open("https://wa.me/"+PHONE+"?text="+encodeURIComponent(msg));
}

</script>

</body>
</html>
