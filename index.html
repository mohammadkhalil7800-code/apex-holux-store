<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 Apex Holux | Global Luxury Market</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800;900&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Montserrat;
}

body{
background:#050505;
color:white;
}

/* HEADER */
header{
position:sticky;
top:0;
z-index:1000;
display:flex;
justify-content:space-between;
align-items:center;
padding:16px 6%;
background:rgba(0,0,0,0.85);
backdrop-filter:blur(12px);
border-bottom:1px solid rgba(255,255,255,0.08);
}

.logo{
font-size:30px;
font-weight:900;
letter-spacing:1px;
}

.logo span{
color:#ff9800;
}

nav a{
color:white;
margin:0 10px;
text-decoration:none;
font-size:14px;
}

nav a:hover{
color:#ff9800;
}

/* HERO */
.hero{
height:90vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
background:linear-gradient(rgba(0,0,0,0.7),#000),
url('https://images.unsplash.com/photo-1528701800489-20be3c5c9c8c') center/cover;
}

.hero h1{
font-size:65px;
font-weight:900;
}

.hero span{
color:#ff9800;
}

.hero p{
opacity:0.8;
margin-top:10px;
font-size:18px;
}

.btn{
margin-top:20px;
padding:14px 35px;
background:#ff9800;
border:none;
font-weight:800;
border-radius:40px;
cursor:pointer;
}

/* PRODUCTS */
.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:22px;
padding:60px 6%;
}

.card{
background:#111;
border-radius:20px;
overflow:hidden;
transition:0.3s;
box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

.card:hover{
transform:translateY(-10px);
}

.card img{
width:100%;
height:230px;
object-fit:cover;
}

.info{
padding:15px;
}

.price{
color:#ff9800;
font-size:22px;
font-weight:900;
margin:8px 0;
}

.add{
width:100%;
padding:12px;
background:#ff9800;
border:none;
font-weight:800;
cursor:pointer;
}

/* CART */
.cart{
padding:40px 6%;
background:#0c0c0c;
}

.total{
color:#ff9800;
font-size:26px;
margin-top:10px;
}

/* WHATSAPP */
.whatsapp{
position:fixed;
bottom:20px;
right:20px;
width:60px;
height:60px;
background:#25D366;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
color:white;
text-decoration:none;
}
</style>
</head>

<body>

<header>
<div class="logo">🔥 Apex <span>Holux</span></div>
<nav>
<a href="#">Home</a>
<a href="#shop">Shop</a>
<a href="#cart">Cart</a>
</nav>
</header>

<section class="hero">
<div>
<h1>GLOBAL LUXURY <span>MARKET</span></h1>
<p>Premium Sneakers • Slides • Sketchers • QD Sandals • Worldwide Fashion</p>
<button class="btn">Explore Now</button>
</div>
</section>

<section class="products" id="shop"></section>

<section class="cart" id="cart">
<h2>🛒 Your Cart</h2>
<div id="cartBox"></div>
<div class="total">Total: $<span id="total">0</span></div>
<button class="btn" onclick="checkout()">Order via WhatsApp</button>
</section>

<a class="whatsapp" href="https://wa.me/93764594322">💬</a>

<script>

const PHONE="93764594322";

let products=[
{name:"Nike Air Force 1",price:90,img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff"},
{name:"Jordan Retro 4",price:180,img:"https://images.unsplash.com/photo-1600180758890-6b94519a8ba6"},
{name:"Adidas Ultraboost",price:120,img:"https://images.unsplash.com/photo-1528701800489-20be3c5c9c8c"},
{name:"Sketchers Comfort",price:95,img:"https://images.unsplash.com/photo-1519741497674-611481863552"},
{name:"Luxury Slides",price:45,img:"https://images.unsplash.com/photo-1600185365483-26d7a4cc7519"}
];

let cart=[];
let total=0;

function show(){
let box=document.getElementById("shop");
box.innerHTML="";
products.forEach((p,i)=>{
box.innerHTML+=`
<div class="card">
<img src="${p.img}">
<div class="info">
<h3>${p.name}</h3>
<div class="price">$${p.price}</div>
<button class="add" onclick="add(${i})">Add To Cart</button>
</div>
</div>`;
});
}
show();

function add(i){
cart.push(products[i]);
total+=products[i].price;
renderCart();
}

function renderCart(){
let box=document.getElementById("cartBox");
box.innerHTML="";
cart.forEach(p=>{
box.innerHTML+=`<p>✔ ${p.name} - $${p.price}</p>`;
});
document.getElementById("total").innerText=total;
}

function checkout(){
let msg="🔥 APEX HOLUX ORDER 🔥\n\n";
cart.forEach(p=>{
msg+=p.name+" - $"+p.price+"\n";
});
msg+="\nTOTAL: $"+total;
window.open("https://wa.me/"+PHONE+"?text="+encodeURIComponent(msg));
}

</script>

</body>
</html>
