<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌍 Apex Holux Global Market (Fixed)</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700;900&display=swap" rel="stylesheet"><style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Montserrat',sans-serif;
}

body{
background:#060606;
color:white;
overflow-x:hidden;
}

header{
position:sticky;
top:0;
width:100%;
padding:18px 6%;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(0,0,0,0.9);
z-index:999;
border-bottom:1px solid rgba(255,255,255,0.1);
}

.logo{
font-size:32px;
font-weight:900;
}

.logo span{color:#ff9900;}

nav{display:flex;gap:20px;}
nav a{color:white;text-decoration:none;font-size:14px;}
nav a:hover{color:#ff9900;}

.products{
padding:70px 6%;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:30px;
}

.card{
background:#111;
border-radius:25px;
overflow:hidden;
}

.card img{width:100%;height:280px;object-fit:cover;}

.info{padding:24px;}

.price{color:#ff9900;font-size:26px;font-weight:900;}

.btn{
width:100%;padding:15px;border:none;border-radius:12px;
background:#ff9900;font-weight:900;cursor:pointer;
}

.cart{
margin:50px 6%;background:#111;padding:35px;border-radius:25px;
}

.total{font-size:28px;color:#ff9900;font-weight:900;}

.checkout{
width:100%;padding:18px;background:#25D366;color:white;border:none;
font-size:18px;font-weight:bold;border-radius:12px;
}
</style></head>
<body><header>
<div class="logo">🔥 Apex <span>Holux</span></div>
</header><section class="products" id="shop"></section><section class="cart" id="cart">
<h1>🛒 Cart</h1>
<div id="cartItems"></div>
<div class="total">Total: $<span id="total">0</span></div>
<button class="checkout" onclick="checkout()">WhatsApp Order</button>
</section><script>
const PHONE='93764594322';

let products=[
{name:"Nike Air Force 1",price:90,img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=700"},
{name:"Jordan Retro 4",price:180,img:"https://images.unsplash.com/photo-1600180758890-6b94519a8ba6?w=700"},
{name:"Adidas Ultraboost",price:120,img:"https://images.unsplash.com/photo-1528701800489-20be3c5c9c8c?w=700"}
];

let cart=[];
let total=0;

function renderProducts(){
const box=document.getElementById("shop");
box.innerHTML="";

products.forEach((p,i)=>{
box.innerHTML+=`
<div class="card">
<img src="${p.img}">
<div class="info">
<h3>${p.name}</h3>
<div class="price">$${p.price}</div>
<button class="btn" onclick="addToCart(${i})">Add To Cart</button>
</div>
</div>`;
});
}

function addToCart(i){
cart.push(products[i]);
updateCart();
}

function updateCart(){
let box=document.getElementById("cartItems");
box.innerHTML="";
total=0;

cart.forEach(p=>{
total+=p.price;
box.innerHTML+=`<p>✔ ${p.name} - $${p.price}</p>`;
});

document.getElementById("total").innerText=total;
}

function checkout(){
let msg="ORDER:\n";
cart.forEach(p=>msg+=`${p.name} - $${p.price}\n`);
msg+="Total: $"+total;
window.open("https://wa.me/"+PHONE+"?text="+encodeURIComponent(msg));
}

renderProducts();
</script></body>
</html>
