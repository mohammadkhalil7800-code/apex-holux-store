<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apex Holux Global Market</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<div class="logo">Apex <span>Holux</span></div>

<input id="search" placeholder="Search global products..." oninput="search()">

<button onclick="toggleCart()">🛒 Cart</button>
</header>

<!-- HERO -->
<section class="hero">
<h1>GLOBAL PREMIUM MARKET</h1>
<p>Top Sneakers • Slides • Sport Shoes • Luxury Fashion</p>
</section>

<!-- PRODUCTS -->
<section id="products" class="products"></section>

<!-- CART -->
<div id="cart" class="cart">
<h2>Cart</h2>
<div id="cartItems"></div>
<p>Total: $<span id="total">0</span></p>
<button onclick="checkout()">Checkout</button>
</div>

<script src="app.js"></script>
</body>
</html>
